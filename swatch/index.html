<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f1efea">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Swatch">
<title>Swatch</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" href="fonts/dancing-script.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* Fonts are bundled so they work offline. Dancing Script for her; Arial for him (Arimo, an Arial clone, where Arial is missing). */
  @font-face { font-family: "Dancing Script"; src: url("fonts/dancing-script.woff2") format("woff2"); font-weight: 500; font-display: block; }
  @font-face { font-family: "Arimo"; src: url("fonts/arimo-400.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: "Arimo"; src: url("fonts/arimo-700.woff2") format("woff2"); font-weight: 700; }

  /* Light neutral surround so the swatch colour reads true. */
  :root {
    --bg: #f1efea; --panel: #fbfaf7; --line: #dcd8cf; --text: #1f1d1a; --muted: #8b867c;
    --ink: #1f1d1a; --ok: #2f8a57; --bad: #c2433a;
    --script: "Dancing Script", "Snell Roundhand", cursive;
    --arial: Arial, Arimo, "Helvetica Neue", Helvetica, sans-serif;
    font-size: 16px;
  }
  body[data-aud="her"] { font-family: var(--script); }
  body[data-aud="him"] { font-family: var(--arial); }
  html[data-aud="her"] { font-size: 20px; }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
  body { font-family: var(--arial);
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; user-select: none; -webkit-user-select: none; }
  button:active { transform: scale(.98); }
  .shell { max-width: 520px; margin: 0 auto; min-height: 100%; padding: 12px 18px 24px; display: flex; flex-direction: column; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 48px; flex: none; }
  .icon-btn { width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel);
    display: grid; place-items: center; font: 20px/1 var(--arial); padding: 0; color: var(--text); }
  .icon-btn[hidden] { visibility: hidden; display: grid; }
  .hud { font-variant-numeric: tabular-nums; font-size: 1.05rem; color: var(--muted); white-space: nowrap; }
  .hud b { color: var(--text); }

  #app { flex: 1; display: flex; flex-direction: column; }
  .screen { flex: 1; display: flex; flex-direction: column; }
  .screen.enter { animation: rise .2s ease-out; }
  .center { justify-content: center; padding-bottom: 48px; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .screen.enter, .pop { animation: none !important; } }

  /* Intro */
  .boxes { display: grid; gap: 16px; }
  .box { text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 22px; padding: 18px;
    display: flex; flex-direction: column; gap: 14px; }
  .box .who { line-height: 1; }
  .box.her .who { font-family: var(--script); font-size: 40px; }
  .box.him .who { font-family: var(--arial); font-weight: 700; font-size: 32px; }
  .crayons { display: flex; height: 80px; align-items: flex-end; gap: 1px; }
  .crayons i { flex: 1; border-radius: 3px 3px 1px 1px; min-width: 0; }
  canvas.strip { display: block; width: 100%; height: 80px; }
  .crayons.fat { gap: 6px; }
  .crayons.fat i { border-radius: 10px 10px 3px 3px; position: relative; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
  .crayons.fat i::before { content: ""; position: absolute; left: 22%; right: 22%; top: -10px; height: 12px;
    background: inherit; clip-path: polygon(50% 0, 100% 100%, 0 100%); filter: brightness(.92); }

  /* Menu */
  .seg { display: grid; gap: 8px; margin-bottom: 18px; }
  .seg.three { grid-template-columns: repeat(3, 1fr); }
  .opt { border: 1.5px solid var(--line); background: var(--panel); border-radius: 14px; padding: 8px 10px; min-height: 64px; font-size: 1.05rem; }
  .opt b { display: block; font-weight: inherit; }
  .opt small { display: block; color: var(--muted); font-size: .72rem; margin-top: 3px; font-weight: 400; }
  body[data-aud="her"] .opt small { font-size: .82rem; }
  .opt[aria-pressed="true"] { border-color: var(--ink); background: #fff; box-shadow: 0 0 0 1px var(--ink); }
  .primary { min-height: 58px; border: 0; border-radius: 16px; background: var(--ink); color: var(--panel); font-size: 1.2rem; }
  body[data-aud="him"] .primary, body[data-aud="him"] .opt[aria-pressed="true"] { font-weight: 700; }
  .best { text-align: center; color: var(--muted); font-size: 1rem; margin: 14px 0 0; min-height: 1.4em; }

  /* Play */
  .bar { display: flex; gap: 4px; margin: 4px 0 14px; }
  .bar i { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
  .bar i.ok { background: var(--ok); } .bar i.bad { background: var(--bad); } .bar i.now { background: var(--ink); }
  .well { background: #e4e1da; border-radius: 24px; padding: 12px; }
  .chip { position: relative; overflow: hidden; height: min(38vh, 290px); border-radius: 16px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.06), inset 0 -28px 36px rgba(0,0,0,.10); }
  .chip::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: linear-gradient(180deg, rgba(255,255,255,.26), transparent 46%); }
  .chip[data-metal]::after { background: linear-gradient(115deg, transparent 28%, rgba(255,255,255,.65) 46%, transparent 62%); }
  .writing .chip { height: min(26vh, 200px); }

  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .choice { min-height: 66px; border: 1.5px solid var(--line); background: var(--panel); border-radius: 14px;
    padding: 6px 12px; font-size: 1.05rem; line-height: 1.15; }
  .choice[data-state="ok"] { border-color: var(--ok); color: var(--ok); box-shadow: 0 0 0 1px var(--ok); }
  .choice[data-state="bad"] { border-color: var(--bad); color: var(--bad); }
  .choice[data-state="idle"] { color: var(--muted); }
  .choice:disabled { cursor: default; transform: none; }

  form.guess { display: flex; gap: 8px; margin-top: 12px; }
  form.guess input { flex: 1; min-width: 0; min-height: 58px; border-radius: 14px; border: 1.5px solid var(--line);
    background: var(--panel); padding: 0 14px; font-size: 1.15rem; outline: none; }
  form.guess input:focus { border-color: var(--ink); }
  form.guess button { min-height: 58px; min-width: 58px; border: 0; border-radius: 14px; background: var(--ink); color: var(--panel); font: 22px var(--arial); }

  .card { margin-top: 12px; display: flex; align-items: center; gap: 12px; }
  .pop { animation: slide .18s ease-out; }
  @keyframes slide { from { transform: translateY(6px); } to { transform: none; } }
  .name { flex: 1; font-size: 1.6rem; line-height: 1.1; display: flex; align-items: center; gap: 10px; }
  body[data-aud="him"] .name { font-weight: 700; font-size: 1.5rem; }
  .mark { font: 700 22px var(--arial); flex: none; }
  .mark.ok { color: var(--ok); } .mark.bad { color: var(--bad); }
  .card .primary { flex: none; min-width: 74px; min-height: 58px; font: 26px var(--arial); }

  /* Done */
  .big { margin-top: 18px !important; font-size: 4.2rem; line-height: 1; text-align: center; margin: 0; font-variant-numeric: tabular-nums; }
  body[data-aud="him"] .big { font-weight: 700; }
  .of { text-align: center; color: var(--muted); font-size: 1.2rem; margin: 6px 0 0; }
  .results { display: flex; flex-direction: column; gap: 6px; margin: 22px 0 18px; }
  .res { display: flex; align-items: center; gap: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 7px 12px 7px 7px; }
  .res i { width: 44px; height: 44px; border-radius: 10px; flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
  .res div { flex: 1; min-width: 0; line-height: 1.15; }
  .res b { display: block; font-weight: inherit; font-size: 1.05rem; }
  body[data-aud="him"] .res b { font-weight: 700; }
  .res s { display: block; color: var(--bad); font-size: .9rem; margin-top: 2px; }
  .res em { font: 700 18px var(--arial); flex: none; }
  .res .t { font: 14px var(--arial); color: var(--muted); flex: none; font-variant-numeric: tabular-nums; }
  .res.ok em { color: var(--ok); } .res.bad em { color: var(--bad); }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .actions .share { grid-column: 1 / -1; }
  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--panel);
    font: 15px var(--arial); padding: 10px 16px; border-radius: 12px; max-width: 90vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ghost { min-height: 58px; border: 1.5px solid var(--line); background: var(--panel); border-radius: 16px; font-size: 1.2rem; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
<script data-goatcounter="https://paolosarcade.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</head>
<body>
<div class="shell">
  <header>
    <button class="icon-btn" id="back" type="button" aria-label="Back" hidden>←</button>
    <span class="hud" id="hud"></span>
    <button class="icon-btn" id="mute" type="button" aria-label="Sound on">🔊</button>
  </header>
  <main id="app"></main>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
