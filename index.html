<style>
  :root {
    --bg: #0a0716;
    --panel: #140f2a;
    --line: #2a2150;
    --text: #ece8ff;
    --muted: #9a92c4;
    --cyan: #3ef2ff;
    --pink: #ff4fd8;
    --lime: #b6ff4a;
    --glow1: #2b0f4a;
    --glow2: #06304a;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #f7f5ff;
    --panel: #ffffff;
    --line: #e0d9f5;
    --text: #1b1535;
    --muted: #625a88;
    --cyan: #0094ad;
    --pink: #d4239c;
    --lime: #b6ff4a;
    --glow1: #ecdcff;
    --glow2: #d6f3ff;
    color-scheme: light;
  }
  :root[data-theme="light"] .eyebrow { text-shadow: none; }
  :root[data-theme="light"] h1 { filter: none; }
  :root[data-theme="light"] .card { box-shadow: 0 2px 10px -4px rgba(40,20,90,.12); }
  :root[data-theme="light"] .play { color: color-mix(in srgb, var(--accent, var(--cyan)) 55%, #1b1535); }
  :root[data-theme="light"] .badge { box-shadow: none; }
  :root[data-theme="light"] .log li::before { box-shadow: none; }

  .toggles { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin: 48px 0 0; }
  .theme-toggle {
    display: inline-flex; align-items: center; gap: 6px;
    font: inherit; font-size: 14px; font-weight: 600; color: var(--text);
    background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 14px; min-height: 36px; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: border-color .15s ease;
  }
  .theme-toggle:hover, .theme-toggle:focus-visible { border-color: var(--cyan); outline: none; }

  /* Sharp mode: every corner square — buttons, tiles, icons, cards, tags, badges, dots */
  :root[data-shape="sharp"] *, :root[data-shape="sharp"] *::before, :root[data-shape="sharp"] *::after { border-radius: 0 !important; }
  * { box-sizing: border-box; margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    min-height: 100vh;
    background:
      radial-gradient(1200px 600px at 10% -10%, var(--glow1) 0%, transparent 60%),
      radial-gradient(900px 500px at 110% 10%, var(--glow2) 0%, transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 48px 20px 64px; }

  header { position: relative; margin-bottom: 40px; padding-top: 12px; }
  .eyebrow {
    font-size: 13px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--cyan); text-shadow: 0 0 12px rgba(62,242,255,.6);
  }
  h1 {
    font-size: clamp(40px, 8vw, 72px); line-height: 1; margin: 10px 0 14px;
    background: linear-gradient(90deg, var(--cyan), var(--pink));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 18px rgba(255,79,216,.35));
  }
  .tagline { color: var(--muted); font-size: 17px; max-width: 560px; }

  h2 { font-size: 14px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 16px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; margin-bottom: 56px; }
  .card {
    position: relative; display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
    padding: 20px; text-decoration: none; color: inherit;
    transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
  }
  .card:hover, .card:focus-visible {
    transform: translateY(-3px); border-color: var(--accent, var(--cyan));
    box-shadow: 0 0 0 1px var(--accent, var(--cyan)), 0 10px 40px -10px var(--accent, var(--cyan));
    outline: none;
  }
  .icon {
    width: 56px; height: 56px; border-radius: 14px; display: grid; place-items: center;
    font-size: 30px; margin-bottom: 14px;
    background: color-mix(in srgb, var(--accent, var(--cyan)) 16%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent, var(--cyan)) 40%, transparent);
  }
  .card h3 { font-size: 20px; margin-bottom: 6px; }
  .card p { color: var(--muted); font-size: 15px; flex: 1; }
  .meta { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; font-size: 13px; color: var(--muted); }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; }
  .play { color: var(--accent, var(--cyan)); font-weight: 600; white-space: nowrap; }
  .badge {
    position: absolute; top: 14px; right: 14px; font-size: 11px; font-weight: 700; letter-spacing: .08em;
    color: #0a0716; background: var(--lime); border-radius: 6px; padding: 2px 7px;
    box-shadow: 0 0 14px rgba(182,255,74,.6);
  }
  .soon { opacity: .55; pointer-events: none; border-style: dashed; }

  /* Split card: two games sharing one card, each half with its own button */
  .card.split { grid-column: span 2; padding: 20px 20px 18px; }
  .card.split:hover { transform: none; }
  .card.split > h3 { padding-right: 48px; }
  .card.split > p { flex: 0; margin-bottom: 14px; }
  .halves { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; flex: 1; }
  .half { display: flex; flex-direction: column; padding: 14px; background: color-mix(in srgb, var(--half) 7%, transparent); }
  .half + .half { border-left: 1px solid var(--line); }
  .half .icon { --accent: var(--half); width: 46px; height: 46px; font-size: 25px; margin-bottom: 10px; }
  .half h4 { font-size: 17px; margin-bottom: 4px; }
  .half p { color: var(--muted); font-size: 14px; flex: 1; margin-bottom: 12px; }
  .btn {
    display: block; text-align: center; text-decoration: none; font-weight: 700; font-size: 15px;
    color: #0a0716; background: var(--half); border-radius: 10px; padding: 10px 8px;
    box-shadow: 0 0 18px -4px var(--half); transition: transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover, .btn:focus-visible { transform: translateY(-2px); box-shadow: 0 0 24px 0 var(--half); outline: none; }
  @media (max-width: 600px) { .card.split { grid-column: auto; } .half { padding: 12px; } }

  .log { list-style: none; padding: 0; border-left: 2px solid var(--line); margin-left: 6px; }
  .log li { position: relative; padding: 0 0 18px 22px; }
  .log li::before {
    content: ""; position: absolute; left: -7px; top: 6px; width: 12px; height: 12px; border-radius: 50%;
    background: var(--bg); border: 2px solid var(--pink); box-shadow: 0 0 10px rgba(255,79,216,.6);
  }
  .log time { font-size: 13px; color: var(--muted); display: block; }
  .log span { font-size: 15px; }

  footer { margin-top: 20px; color: var(--muted); font-size: 13px; text-align: center; }
  footer a { color: var(--cyan); }

  @media (prefers-reduced-motion: reduce) { .card { transition: none; } .card:hover { transform: none; } }
</style>

const NEW_DAYS = 14;
const fmt = d => new Date(d + "T12:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const games = [...GAMES].sort((a, b) => b.added.localeCompare(a.added));
const live = games.filter(g => !g.soon);
const isNew = g => (Date.now() - new Date(g.added + "T12:00:00")) / 864e5 <= NEW_DAYS;

const themeBtn = document.getElementById("themeToggle");
const themeMeta = document.querySelector('meta[name="theme-color"]');
function applyTheme(t) {
  if (t === "light") document.documentElement.dataset.theme = "light";
  else delete document.documentElement.dataset.theme;
  themeBtn.textContent = t === "light" ? "🌙 Dark" : "☀️ Light";
  themeBtn.setAttribute("aria-label", t === "light" ? "Switch to dark theme" : "Switch to light theme");
  themeMeta.content = t === "light" ? "#f7f5ff" : "#0a0716";
}
applyTheme(document.documentElement.dataset.theme === "light" ? "light" : "dark");
themeBtn.addEventListener("click", () => {
  const t = document.documentElement.dataset.theme === "light" ? "dark" : "light";
  applyTheme(t);
  try { localStorage.setItem("arcade:theme", t); } catch (e) {}
});

const shapeBtn = document.getElementById("shapeToggle");
function applyShape(s) {
  if (s === "sharp") document.documentElement.dataset.shape = "sharp";
  else delete document.documentElement.dataset.shape;
  shapeBtn.textContent = s === "sharp" ? "● Round" : "■ Sharp";
  shapeBtn.setAttribute("aria-label", s === "sharp" ? "Switch to rounded corners" : "Switch to sharp corners");
}
applyShape(document.documentElement.dataset.shape === "sharp" ? "sharp" : "round");
shapeBtn.addEventListener("click", () => {
  const s = document.documentElement.dataset.shape === "sharp" ? "round" : "sharp";
  applyShape(s);
  try { localStorage.setItem("arcade:shape", s); } catch (e) {}
});

const splitCard = g => `
  <div class="card split" style="--accent:${esc(g.color || "#3ef2ff")}">
    ${isNew(g) ? '<span class="badge">NEW</span>' : ""}
    <h3>${esc(g.title)}</h3>
    ${g.desc ? `<p>${esc(g.desc)}</p>` : ""}
    <div class="halves">${g.split.map(h => `
      <div class="half" style="--half:${esc(h.color || g.color || "#3ef2ff")}">
        <div class="icon">${esc(h.emoji || "🎮")}</div>
        <h4>${esc(h.title)}</h4>
        <p>${esc(h.desc)}</p>
        <a class="btn" href="${esc(h.url)}">Play ▶</a>
      </div>`).join("")}
    </div>
    <div class="meta"><div class="tags">${(g.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div></div>
  </div>`;

document.getElementById("grid").innerHTML = games.map(g => g.split ? splitCard(g) : `
  <a class="card${g.soon ? " soon" : ""}" href="${esc(g.url)}" ${g.soon ? 'aria-disabled="true"' : ""} style="--accent:${esc(g.color || "#3ef2ff")}">
    ${g.soon ? '<span class="badge" style="background:#9a92c4">SOON</span>' : isNew(g) ? '<span class="badge">NEW</span>' : ""}
    <div class="icon">${esc(g.emoji || "🎮")}</div>
    <h3>${esc(g.title)}</h3>
    <p>${esc(g.desc)}</p>
    <div class="meta">
      <div class="tags">${(g.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
      <span class="play">${g.soon ? "Coming soon" : "Play ▶"}</span>
    </div>
  </a>`).join("");

document.getElementById("log").innerHTML = live.map(g => `
  <li><time datetime="${esc(g.added)}">${fmt(g.added)}</time><span>${g.split ? g.split.map(h => `${esc(h.emoji || "🎮")} <b>${esc(h.title)}</b>`).join(" and ") + " joined" : `${esc(g.emoji || "🎮")} <b>${esc(g.title)}</b> joined`} the arcade</span></li>`).join("");
</script>
</body>
</html>
