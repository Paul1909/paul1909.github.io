<style>
  @font-face { font-family: "Orbitron"; src: url("./fonts/orbitron-900.woff2") format("woff2"); font-weight: 900; font-display: swap; }
  :root {
    --bg: #0a0716;
    --panel: #140f2a;
    --line: #2a2150;
    --text: #ece8ff;
    --muted: #9a92c4;
    --cyan: #3ef2ff;
    --pink: #ff4fd8;
    --lime: #b6ff4a;
    --glow1: #2b0f4a;
    --glow2: #06304a;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #f7f5ff;
    --panel: #ffffff;
    --line: #e0d9f5;
    --text: #1b1535;
    --muted: #625a88;
    --cyan: #0094ad;
    --pink: #d4239c;
    --lime: #b6ff4a;
    --glow1: #ecdcff;
    --glow2: #d6f3ff;
    color-scheme: light;
  }
  :root[data-theme="light"] .eyebrow { text-shadow: none; }
  :root[data-theme="light"] h1 { filter: none; }
  :root[data-theme="light"] .card { box-shadow: 0 2px 10px -4px rgba(40,20,90,.12); }
  :root[data-theme="light"] .play { color: color-mix(in srgb, var(--accent, var(--cyan)) 55%, #1b1535); }
  :root[data-theme="light"] .badge { box-shadow: none; }
  :root[data-theme="light"] .log li::before { box-shadow: none; }

  .toggles { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin: 48px 0 0; }
  .theme-toggle {
    display: inline-flex; align-items: center; gap: 6px;
    font: inherit; font-size: 14px; font-weight: 600; color: var(--text);
    background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 14px; min-height: 36px; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: border-color .15s ease;
  }
  .theme-toggle:hover, .theme-toggle:focus-visible { border-color: var(--cyan); outline: none; }

  /* Sharp mode: every corner square — buttons, tiles, icons, cards, tags, badges, dots */
  :root[data-shape="sharp"] *, :root[data-shape="sharp"] *::before, :root[data-shape="sharp"] *::after { border-radius: 0 !important; }
  * { box-sizing: border-box; margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    min-height: 100vh;
    background:
      radial-gradient(1200px 600px at 10% -10%, var(--glow1) 0%, transparent 60%),
      radial-gradient(900px 500px at 110% 10%, var(--glow2) 0%, transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 24px 20px 64px; }

  header { position: relative; margin-bottom: 36px; text-align: center; }
  .eyebrow {
    font-size: 13px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--cyan); text-shadow: 0 0 12px rgba(62,242,255,.6);
  }
  h1 {
    font-family: "Orbitron", ui-rounded, system-ui, sans-serif; font-weight: 900;
    font-size: clamp(40px, 8vw, 72px); line-height: 1; margin: 10px 0 14px;
    background: linear-gradient(90deg, var(--cyan), var(--pink));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 18px rgba(255,79,216,.35));
  }
  .tagline { color: var(--muted); font-size: 17px; max-width: 560px; margin: 0 auto; }

  h2 { font-size: 14px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 16px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; margin-bottom: 56px; }
  .card {
    position: relative; display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
    padding: 20px; text-decoration: none; color: inherit;
    transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
  }
  .card:hover, .card:focus-visible {
    transform: translateY(-3px); border-color: var(--accent, var(--cyan));
    box-shadow: 0 0 0 1px var(--accent, var(--cyan)), 0 10px 40px -10px var(--accent, var(--cyan));
    outline: none;
  }
  .icon {
    width: 56px; height: 56px; border-radius: 14px; display: grid; place-items: center;
    font-size: 30px; margin-bottom: 14px;
    background: color-mix(in srgb, var(--accent, var(--cyan)) 16%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent, var(--cyan)) 40%, transparent);
  }
  .card h3 { font-size: 20px; margin-bottom: 6px; }
  .card p { color: var(--muted); font-size: 15px; flex: 1; }
  .meta { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; font-size: 13px; color: var(--muted); }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; }
  .play { color: var(--accent, var(--cyan)); font-weight: 600; white-space: nowrap; }
  .badge {
    position: absolute; top: 14px; right: 14px; font-size: 11px; font-weight: 700; letter-spacing: .08em;
    color: #0a0716; background: var(--lime); border-radius: 6px; padding: 2px 7px;
    box-shadow: 0 0 14px rgba(182,255,74,.6);
  }
  .soon { opacity: .55; pointer-events: none; border-style: dashed; }

  /* Split card: two games sharing one card, each half with its own button */
  .card.split { grid-column: span 2; padding: 20px 20px 18px; }
  .card.split:hover { transform: none; }
  .card.split > h3 { padding-right: 48px; }
  .card.split > p { flex: 0; margin-bottom: 14px; }
  .halves { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; flex: 1; }
  .half { display: flex; flex-direction: column; padding: 14px; background: color-mix(in srgb, var(--half) 7%, transparent); }
  .half + .half { border-left: 1px solid var(--line); }
  .half .icon { --accent: var(--half); width: 46px; height: 46px; font-size: 25px; margin-bottom: 10px; }
  /* App icons (icons/<slug>.svg, Candy Tile style). Emoji stays as the fallback if a tile is missing. */
  .icon.tile { background: none; border: 0; border-radius: 22%; overflow: hidden;
    box-shadow: 0 8px 18px -8px var(--accent, var(--cyan)); }
  .icon.tile img { width: 100%; height: 100%; display: block; }
  .mini { width: 20px; height: 20px; border-radius: 22%; vertical-align: -4px; margin-right: 2px; }
  .half h4 { font-size: 17px; margin-bottom: 4px; }
  .half p { color: var(--muted); font-size: 14px; flex: 1; margin-bottom: 12px; }
  .btn {
    display: block; text-align: center; text-decoration: none; font-weight: 700; font-size: 15px;
    color: #0a0716; background: var(--half); border-radius: 10px; padding: 10px 8px;
    box-shadow: 0 0 18px -4px var(--half); transition: transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover, .btn:focus-visible { transform: translateY(-2px); box-shadow: 0 0 24px 0 var(--half); outline: none; }
  @media (max-width: 600px) { .card.split { grid-column: auto; } .half { padding: 12px; } }

  .log { list-style: none; padding: 0; border-left: 2px solid var(--line); margin-left: 6px; }
  .log li { position: relative; padding: 0 0 18px 22px; }
  .log li::before {
    content: ""; position: absolute; left: -7px; top: 6px; width: 12px; height: 12px; border-radius: 50%;
    background: var(--bg); border: 2px solid var(--pink); box-shadow: 0 0 10px rgba(255,79,216,.6);
  }
  .log time { font-size: 13px; color: var(--muted); display: block; }
  .log span { font-size: 15px; }

  footer { margin-top: 20px; color: var(--muted); font-size: 13px; text-align: center; }
  footer a { color: var(--cyan); }

  /* Whole card is a link via a stretched ::after, so the vote buttons can sit inside it */
  .stretch { color: inherit; text-decoration: none; outline: none; }
  .stretch::after { content: ""; position: absolute; inset: 0; border-radius: inherit; z-index: 0; }
  .card:has(.stretch:focus-visible) {
    border-color: var(--accent, var(--cyan));
    box-shadow: 0 0 0 1px var(--accent, var(--cyan)), 0 10px 40px -10px var(--accent, var(--cyan));
  }
  .side { display: flex; align-items: center; gap: 10px; margin-left: auto; }
  .meta { gap: 10px; }

  /* Like button: no numbers shown, only your own like lights up */
  .votes { position: relative; z-index: 1; display: inline-flex; gap: 4px; }
  .vote {
    display: grid; place-items: center; width: 34px; height: 34px; padding: 0; cursor: pointer;
    background: transparent; color: var(--muted); border: 1px solid var(--line); border-radius: 10px;
    -webkit-tap-highlight-color: transparent; transition: color .15s, border-color .15s, background .15s, transform .15s;
  }
  .vote svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; }
  .vote:hover, .vote:focus-visible { color: var(--text); border-color: var(--accent, var(--cyan)); outline: none; }
  .vote[aria-pressed="true"] {
    color: var(--accent, var(--cyan)); border-color: var(--accent, var(--cyan));
    background: color-mix(in srgb, var(--accent, var(--cyan)) 14%, transparent);
  }
  .vote[aria-pressed="true"] svg { fill: currentColor; }
  .vote.pop { animation: pop .3s ease; }
  /* Share button: same look as the like button, opens the phone's share sheet */
  .vote.share svg { stroke-linecap: round; }
  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); z-index: 20;
    transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
    background: var(--panel); color: var(--text); border: 1px solid var(--cyan); border-radius: 999px;
    padding: 8px 16px; font-size: 14px; font-weight: 600; max-width: calc(100vw - 32px);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    box-shadow: 0 6px 24px -8px var(--cyan); transition: opacity .2s ease, transform .2s ease;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  @keyframes pop { 50% { transform: scale(1.25); } }

  /* Sort bar */
  .bar {
    position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: center; gap: 10px;
    margin: 0 -20px 20px; padding: calc(10px + env(safe-area-inset-top)) 20px 10px;
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  }
  .seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; }
  .seg button {
    font: inherit; font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap;
    background: none; border: 0; border-radius: 999px; padding: 6px 11px; min-height: 32px; cursor: pointer;
    -webkit-tap-highlight-color: transparent; transition: color .15s, background .15s;
  }
  .seg button:hover, .seg button:focus-visible { color: var(--text); outline: none; }
  .seg button[aria-pressed="true"] { color: #0a0716; background: var(--cyan); }
  .seg button.loading { opacity: .6; }
  /* Per-app view count: little play icon + number */
  .plays { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .plays svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; }
  .card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
  .card-head h3 { margin-bottom: 0; }
  .half-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 0 8px; margin-bottom: 4px; }
  .half-head h4 { margin-bottom: 0; }
  .note { font-size: 13px; color: var(--muted); text-align: center; margin: -8px 0 16px; }
  .note[hidden] { display: none; }
  @media (max-width: 380px) { .seg button { padding: 6px 8px; font-size: 12px; } }

  @media (prefers-reduced-motion: reduce) { .card { transition: none; } .card:hover { transform: none; } .vote.pop { animation: none; } }
</style>

</script>

const NEW_DAYS = 14;
const fmt = d => new Date(d + "T12:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const games = [...GAMES].sort((a, b) => b.added.localeCompare(a.added));
const live = games.filter(g => !g.soon);
const slugOf = g => (String(g.url || "").match(/^\.?\/?([\w-]+)\/?$/) || [])[1];
const iconImg = (g, cls) => { const s = slugOf(g); return s
  ? `<img src="./icons/${esc(s)}.svg" alt="" ${cls ? `class="${cls}" ` : ""}onerror="this.parentNode.classList.remove('tile');this.replaceWith(document.createTextNode(this.dataset.e))" data-e="${esc(g.emoji || "🎮")}">`
  : esc(g.emoji || "🎮"); };
const iconBox = g => `<div class="icon${slugOf(g) ? " tile" : ""}">${iconImg(g)}</div>`;
const isNew = g => (Date.now() - new Date(g.added + "T12:00:00")) / 864e5 <= NEW_DAYS;

const themeBtn = document.getElementById("themeToggle");

  themeBtn.textContent = t === "light" ? "🌙 Dark" : "☀️ Light";
  themeBtn.setAttribute("aria-label", t === "light" ? "Switch to dark theme" : "Switch to light theme");
  themeMeta.content = t === "light" ? "#f7f5ff" : "#0a0716";
}
applyTheme(document.documentElement.dataset.theme === "light" ? "light" : "dark");
themeBtn.addEventListener("click", () => {
  const t = document.documentElement.dataset.theme === "light" ? "dark" : "light";

/* ---------- likes and stats (GoatCounter) ----------
   A like is sent to GoatCounter as an event: like-<id>, and unlike-<id> when
   it's taken back. Counts are read from
   GoatCounter's public counter (needs "Allow adding visitor counts on your
   website" on in the GoatCounter settings). Like numbers are only used
   for sorting, never shown. Each card shows its app's views (visits to the
   app's folder). GoatCounter refreshes the numbers every few hours. */
const GC_COUNTER = "https://paolosarcade.goatcounter.com/counter/";
const idOf = g => g.split ? g.split.map(slugOf).join("_") : slugOf(g);
const pagesOf = g => (g.split || [g]).map(slugOf).filter(Boolean).map(s => `/${s}/`);
const PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.8v14.4L19 12z"/></svg>';
const plays = gs => {
  if (!stats.views) return "";
  const n = gs.reduce((t, g) => t + (stats.views[`/${slugOf(g)}/`] || 0), 0);
  // The "k" is a joke: every count shows as thousands (40 → "40k").
  return `<span class="plays" title="${n.toLocaleString("en-US")}k views">${PLAY}${n.toLocaleString("en-US")}k<span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)"> views</span></span>`;
};
const THUMB = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 10h4v11H2zM6 20.5V10.5l5.6-7.3c.9-1.1 2.7-.5 2.7 1v4.3h5.2c1.4 0 2.5 1.3 2.2 2.7l-1.6 7.6c-.2 1-1.1 1.7-2.2 1.7z"/></svg>';

let votes = {};
try { votes = JSON.parse(localStorage.getItem("arcade:votes")) || {}; } catch (e) {}
for (const k in votes) if (votes[k] !== 1) delete votes[k];  // old dislikes from before the dislike button was removed
const saveVotes = () => { try { localStorage.setItem("arcade:votes", JSON.stringify(votes)); } catch (e) {} };

function gcEvent(name, title) {
  try { window.goatcounter && window.goatcounter.count && window.goatcounter.count({ path: name, title, event: true }); } catch (e) {}
}

const SHARE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5M5 12v7.5c0 .8.7 1.5 1.5 1.5h11c.8 0 1.5-.7 1.5-1.5V12"/></svg>';

const voteBox = g => {
  const id = idOf(g); if (!id || g.soon) return "";
  const v = votes[id] || 0;
  return `<div class="votes" data-id="${esc(id)}" data-title="${esc(g.title)}">
    <button type="button" class="vote share" aria-label="Share ${esc(g.title)}" title="Share with a friend">${SHARE}</button>
    <button type="button" class="vote up" data-v="1" aria-pressed="${v === 1}" aria-label="Like ${esc(g.title)}">${THUMB}</button>
  </div>`;
};

/* Share: the phone's share sheet with the app's own link (its page shows the preview);
   on desktop without a share sheet, the text + link go to the clipboard. */
const toastEl = document.getElementById("toast");
let toastT;
function toast(msg) {
  toastEl.textContent = msg; toastEl.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove("show"), 2200);
}
const abs = u => new URL(u, location.href).href.replace(/[?#].*$/, "");
async function shareGame(g) {
  const parts = (g.split || [g]).filter(h => h.url);
  const url = abs(parts[0].url);
  const text = g.split
    ? `${g.title} on Paolo's Arcade 🕹️\n${parts.map(h => `${h.title}: ${abs(h.url)}`).join("\n")}`
    : `Try ${g.title} on Paolo's Arcade 🕹️`;
  const copyText = g.split ? text : `${text}\n${url}`;
  gcEvent(`share-${idOf(g)}`, `↗ Share: ${g.title}`);
  if (navigator.share) {
    try { return await navigator.share(g.split ? { title: g.title, text } : { title: g.title, text, url }); }
    catch (e) { if (e && e.name === "AbortError") return; }
  }
  try { await navigator.clipboard.writeText(copyText); toast("Link copied, paste it to a friend"); }
  catch (e) { toast(url); }
}

const tagsHtml = g => `<div class="tags">${(g.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>`;

const splitCard = g => `
  <div class="card split" style="--accent:${esc(g.color || "#3ef2ff")}">
    ${isNew(g) ? '<span class="badge">NEW</span>' : ""}
    <h3>${esc(g.title)}</h3>
    ${g.desc ? `<p>${esc(g.desc)}</p>` : ""}
    <div class="halves">${g.split.map(h => `
      <div class="half" style="--half:${esc(h.color || g.color || "#3ef2ff")}">
        ${iconBox(h)}
        <div class="half-head"><h4>${esc(h.title)}</h4>${plays([h])}</div>
        <p>${esc(h.desc)}</p>
        <a class="btn" href="${esc(h.url)}">Play ▶</a>
      </div>`).join("")}
    </div>
    <div class="meta">${tagsHtml(g)}<div class="side">${voteBox(g)}</div></div>
  </div>`;

const card = g => g.split ? splitCard(g) : `
  <div class="card${g.soon ? " soon" : ""}" style="--accent:${esc(g.color || "#3ef2ff")}">
    ${g.soon ? '<span class="badge" style="background:#9a92c4">SOON</span>' : isNew(g) ? '<span class="badge">NEW</span>' : ""}
    ${iconBox(g)}
    <div class="card-head"><h3>${g.soon ? esc(g.title) : `<a class="stretch" href="${esc(g.url)}">${esc(g.title)}</a>`}</h3>${g.soon ? "" : plays([g])}</div>
    <p>${esc(g.desc)}</p>
    <div class="meta">
      ${tagsHtml(g)}
      <div class="side">${voteBox(g)}<span class="play">${g.soon ? "Coming soon" : "Play ▶"}</span></div>
    </div>
  </div>`;

const grid = document.getElementById("grid");
grid.addEventListener("click", e => {
  const sh = e.target.closest(".vote.share");
  if (sh) {
    e.preventDefault();
    const g = live.find(x => idOf(x) === sh.parentNode.dataset.id);
    if (g) shareGame(g);
    return;
  }
  const btn = e.target.closest(".vote"); if (!btn) return;
  e.preventDefault();
  const box = btn.parentNode, id = box.dataset.id, title = box.dataset.title;
  const old = votes[id] || 0, pick = +btn.dataset.v, now = old === pick ? 0 : pick;
  if (old === 1) gcEvent(`unlike-${id}`, `↩︎ Unlike: ${title}`);
  if (now === 1) gcEvent(`like-${id}`, `👍 Like: ${title}`);
  if (now) votes[id] = now; else delete votes[id];
  saveVotes();
  box.querySelectorAll(".vote").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.v === now)));
  if (now) { btn.classList.remove("pop"); void btn.offsetWidth; btn.classList.add("pop"); try { navigator.vibrate && navigator.vibrate(12); } catch (e) {} }
});

/* Reading counts: one small request per path, a few at a time, cached for the visit. */
async function gcCount(path) {
  const r = await fetch(GC_COUNTER + encodeURIComponent(path) + ".json");
  if (r.status === 404) return 0;               // nothing counted yet
  if (!r.ok) throw new Error("goatcounter " + r.status);
  const j = await r.json();
  return parseInt(String(j.count).replace(/\D/g, ""), 10) || 0;  // "1,234" / "1 234" / "1'234"
}
async function pool(items, fn, n = 6) {
  const out = new Array(items.length); let i = 0, ok = 0, fail = 0;
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, async () => {
    while (i < items.length) { const k = i++; try { out[k] = await fn(items[k]); ok++; } catch (e) { out[k] = 0; fail++; } }
  }));
  if (!ok && fail) throw new Error("counter unavailable");
  return out;
}
const STATS_KEY = "arcade:stats2", STATS_TTL = 15 * 60e3;
let stats = {};
try { const s = JSON.parse(sessionStorage.getItem(STATS_KEY)); if (s && Date.now() - s.t < STATS_TTL) stats = s; } catch (e) {}
const saveStats = () => { try { sessionStorage.setItem(STATS_KEY, JSON.stringify({ ...stats, t: Date.now() })); } catch (e) {} };

async function loadViews() {
  if (stats.views) return stats.views;
  const paths = live.flatMap(pagesOf), n = await pool(paths, gcCount), res = {};
  paths.forEach((p, k) => res[p] = n[k]);
  stats.views = res; saveStats();
  return res;
}
async function loadStats(kind) {
  if (kind === "clicked") return loadViews();
  if (stats[kind]) return stats[kind];
  const res = {};
  {
    const ids = live.map(idOf);
    const ups = await pool(ids, id => gcCount("like-" + id));
    const upIds = ids.filter((_, k) => ups[k] > 0);  // only ask for take-backs where there were likes
    const un = Object.fromEntries((await pool(upIds, id => gcCount("unlike-" + id))).map((n, k) => [upIds[k], n]));
    ids.forEach((id, k) => res[id] = Math.max(0, ups[k] - (un[id] || 0)));
  }
  stats[kind] = res; saveStats();
  return res;
}

/* Sorting */
const byLatest = (a, b) => b.added.localeCompare(a.added);
const soonLast = (a, b) => (a.soon ? 1 : 0) - (b.soon ? 1 : 0);
function ordered(kind) {
  const s = kind === "clicked" ? stats.views : stats[kind];
  if (kind === "latest" || !s) return games;
  const val = g => kind === "clicked" ? pagesOf(g).reduce((t, p) => t + (s[p] || 0), 0) : s[idOf(g)];
  return [...games].sort((a, b) => soonLast(a, b) || (kind === "clicked"
    ? (val(b) || 0) - (val(a) || 0)
    : (val(b) || 0) - (val(a) || 0)
  ) || byLatest(a, b));
}
const render = kind => { grid.innerHTML = ordered(kind).map(card).join(""); };

const sortBox = document.getElementById("sort"), note = document.getElementById("note");
let sortKind = "latest", sortReq = 0;
sortBox.addEventListener("click", async e => {
  const btn = e.target.closest("button[data-sort]"); if (!btn) return;
  const kind = btn.dataset.sort, req = ++sortReq;
  sortKind = kind; note.hidden = true;
  sortBox.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b === btn)));
  if (kind !== "latest" && !stats[kind === "clicked" ? "views" : kind]) {
    btn.classList.add("loading");
    try { await loadStats(kind); }
    catch (err) { note.textContent = "Counts aren't available right now, so this is still the latest first."; note.hidden = false; }
    btn.classList.remove("loading");
  }
  if (req === sortReq) render(sortKind);
});

render("latest");

/* Views on every card: load once, then redraw the grid in the current order */
if (stats.views) render(sortKind);
else loadViews().then(() => render(sortKind)).catch(() => {});

document.getElementById("log").innerHTML = live.map(g => `
  <li><time datetime="${esc(g.added)}">${fmt(g.added)}</time><span>${g.split ? g.split.map(h => `${iconImg(h, "mini")} <b>${esc(h.title)}</b>`).join(" and ") + " joined" : `${iconImg(g, "mini")} <b>${esc(g.title)}</b> joined`} the arcade</span></li>`).join("");
</script>
