<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paolo's Arcade</title>
<meta name="description" content="Small games Paolo makes with AI, for playing with friends on one phone.">
<meta name="theme-color" content="#FBF6F4">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='44' fill='%23FDEFF2' stroke='%23CF5C78' stroke-width='6'/><text x='50' y='67' font-size='48' text-anchor='middle' fill='%23CF5C78' font-family='serif'>遊</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FBF6F4;   /* sakura-tinted washi */
    --card:  #FFFEFB;
    --sumi:  #3D3B4A;   /* soft ink */
    --muted: #7A7688;
    --rule:  #EADFDC;
    --hanko: #CF5C78;   /* seal red, softened */
    --serif: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif CJK JP", "Noto Serif CJK TC", serif;
    --sans:  "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Noto Sans CJK JP", "Noto Sans CJK TC", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    min-height: 100vh;
    background: var(--paper);
    color: var(--sumi);
    font-family: var(--sans);
    font-weight: 500;
    font-size: 16px;
    line-height: 1.6;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 56px 22px 72px; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--hanko); outline-offset: 4px; border-radius: 6px; }

  /* ---------- header ---------- */
  header { display: flex; justify-content: space-between; gap: 24px; margin-bottom: 40px; }
  h1 {
    font-family: var(--serif); font-weight: 800;
    font-size: clamp(40px, 9vw, 64px); line-height: 1.05; letter-spacing: -.01em;
  }
  .lede { margin-top: 14px; color: var(--muted); font-size: 17px; max-width: 30em; }
  .tate {
    writing-mode: vertical-rl; font-family: var(--serif); font-weight: 600;
    font-size: 18px; letter-spacing: .3em; color: var(--muted);
    border-left: 1px solid var(--rule); padding-left: 10px; flex: none; align-self: flex-start;
  }

  /* ---------- stamp card ---------- */
  .card {
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 22px 22px 26px;
    box-shadow: 0 1px 0 var(--rule), 0 18px 40px -28px rgba(120, 80, 90, .35);
    position: relative;
  }
  .card::before {           /* punched hole, like a real rally card */
    content: ""; position: absolute; top: 14px; right: 14px; width: 14px; height: 14px;
    border-radius: 50%; background: var(--paper); box-shadow: inset 0 1px 2px rgba(0,0,0,.12);
  }
  .card-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 4px; padding-right: 28px; }
  .card-head h2 { font-family: var(--serif); font-weight: 800; font-size: 22px; }
  .card-head .jp { font-family: var(--serif); color: var(--hanko); font-size: 15px; }
  .card-note { color: var(--muted); font-size: 14px; margin-bottom: 22px; }

  .stamps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px 12px; }
  @media (max-width: 480px) { .card { padding: 20px 14px 22px; } .stamps { gap: 18px 6px; } .stamp-name { font-size: 12px; } }

  .stamp { display: flex; flex-direction: column; align-items: center; gap: 8px; text-decoration: none; }
  .seal {
    --deep: color-mix(in oklab, var(--ink) 72%, var(--sumi));
    width: min(88px, 17vw); aspect-ratio: 1; border-radius: 50%;
    display: grid; place-items: center; position: relative;
    border: 3px solid var(--ink);
    background: color-mix(in oklab, var(--ink) 13%, var(--card));
    color: var(--deep);
    font-family: var(--serif); font-weight: 800; font-size: clamp(26px, 7.5vw, 42px); line-height: 1;
    transform: rotate(var(--tilt, 0deg));
    filter: url(#ink);
    transition: transform .2s ease;
  }
  .seal::before {
    content: ""; position: absolute; inset: 5px; border-radius: 50%;
    border: 1.5px solid var(--ink); opacity: .75;
  }
  a.stamp:hover .seal { transform: rotate(0deg) scale(1.05); }
  .stamp-name { font-size: 13px; text-align: center; line-height: 1.3; }
  .empty .seal {
    border: 2px dashed #D9CFCC; background: transparent; color: #D9CFCC; filter: none;
    font-size: clamp(22px, 6vw, 28px);
  }
  .empty .seal::before { display: none; }
  .empty .stamp-name { color: #B9B0AE; }

  .stamp.fresh .seal { animation: thunk .55s cubic-bezier(.3, 1.6, .5, 1) .35s both; }
  @keyframes thunk {
    0%   { transform: scale(1.7) rotate(-18deg); opacity: 0; }
    60%  { opacity: 1; }
    100% { transform: rotate(var(--tilt)); opacity: 1; }
  }

  /* ---------- game list ---------- */
  .list-head { font-family: var(--serif); font-weight: 800; font-size: 22px; margin: 52px 0 6px; }
  .list-note { color: var(--muted); font-size: 14px; margin-bottom: 8px; }
  .games { list-style: none; padding: 0; }
  .game { border-bottom: 1px dotted #D9CFCC; }
  .game a {
    display: grid; grid-template-columns: 44px 1fr auto; gap: 4px 16px; align-items: start;
    padding: 18px 4px; text-decoration: none;
  }
  .mini {
    width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
    background: color-mix(in oklab, var(--ink) 22%, var(--card));
    color: color-mix(in oklab, var(--ink) 72%, var(--sumi));
    font-family: var(--serif); font-weight: 800; font-size: 22px; grid-row: span 2;
  }
  .game h3 { font-family: var(--serif); font-weight: 800; font-size: 20px; line-height: 1.3; display: flex; align-items: center; gap: 8px; }
  .shin {
    font-family: var(--serif); font-size: 12px; font-weight: 800; color: #fff; background: var(--hanko);
    width: 22px; height: 22px; display: inline-grid; place-items: center; border-radius: 3px; transform: rotate(-4deg);
  }
  .game p { color: var(--muted); font-size: 15px; grid-column: 2; max-width: 34em; }
  .side { text-align: right; font-size: 13px; color: var(--muted); white-space: nowrap; grid-row: span 2; }
  .play {
    display: inline-block; margin-top: 6px; font-size: 14px; font-weight: 700; color: var(--sumi);
    background: color-mix(in oklab, var(--ink) 30%, var(--card)); border-radius: 999px; padding: 4px 14px;
  }
  .game a:hover .play { background: color-mix(in oklab, var(--ink) 50%, var(--card)); }
  @media (max-width: 480px) {
    .game a { grid-template-columns: 44px 1fr; }
    .side { grid-row: auto; grid-column: 2; text-align: left; display: flex; gap: 12px; align-items: center; }
    .play { margin-top: 0; }
  }

  footer { margin-top: 48px; color: var(--muted); font-size: 13px; }

  @media (prefers-reduced-motion: reduce) {
    .stamp.fresh .seal { animation: none; }
    .seal { transition: none; }
  }
</style>
</head>
<body>
<!-- rough ink edges for the stamps -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="ink"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2.2"/></filter>
</svg>

<div class="wrap">
  <header>
    <div>
      <h1>Paolo's Arcade</h1>
      <p class="lede">Small games I make with AI, for playing with friends on one phone. Most work offline and can be added to your home screen.</p>
    </div>
    <div class="tate" lang="ja">あそびば</div>
  </header>

  <section class="card" aria-labelledby="card-title">
    <div class="card-head">
      <h2 id="card-title">Stamp card</h2>
      <span class="jp" lang="ja">スタンプラリー</span>
    </div>
    <p class="card-note" id="card-note"></p>
    <div class="stamps" id="stamps"></div>
  </section>

  <h2 class="list-head">All games</h2>
  <p class="list-note">Newest first.</p>
  <ul class="games" id="games"></ul>

  <footer>Made by Paolo. New games land here first.</footer>
</div>

<script>
/* ===========================================================
   ADD A NEW GAME: copy one block, paste it at the top of the
   list, change the details, and commit. That's it.
   - kanji:   one character for the stamp (meaning goes in "meaning")
   - url:     the game folder, e.g. "./my-new-game/"
   - added:   date it joined the arcade (YYYY-MM-DD)
   - color:   stamp ink, a pastel works best
   - soon:    true = shows as "coming soon", not clickable
   Pastels that suit the page:
   sakura #EE9FB5 · matcha #8DBB7A · sora #7FB2DD · fuji #A991D6
   yamabuki #E9B949 · momo #F2A28E · wakaba #B5CF6B · mizu #74C4C0
   =========================================================== */
const GAMES = [
  {
    title: "Atomic Chess",
    kanji: "爆", meaning: "explosion",
    desc: "Chess with a bang: every capture explodes and wipes out nearby pieces. Blow up the enemy king to win.",
    url: "./atomic-chess/",
    added: "2026-11-06",
    players: "2 players",
    color: "#E9B949"
  },
  {
    title: "FingerTwist",
    kanji: "指", meaning: "finger",
    desc: "Tap the colours as they light up and keep your fingers down. Up to 4 players on one screen.",
    url: "./finger-twist/",
    added: "2026-11-06",
    players: "1–4 players",
    color: "#EE9FB5"
  },
  {
    title: "Neon Ice Hockey",
    kanji: "氷", meaning: "ice",
    desc: "Air hockey for two on one phone. Move your mallet anywhere in your half.",
    url: "./neon-ice-hockey/",
    added: "2026-11-05",
    players: "2 players",
    color: "#7FB2DD"
  },
  {
    title: "Neon Pong Duo",
    kanji: "球", meaning: "ball",
    desc: "Classic pong with themes and speeds. Lay the phone flat between you and play.",
    url: "./neon-pong-duo/",
    added: "2026-11-05",
    players: "2 players",
    color: "#A991D6"
  },
  {
    title: "Dots and Lines",
    kanji: "線", meaning: "line",
    desc: "Punti e Linee: take turns drawing lines and close boxes to score.",
    url: "./dots-and-lines/",
    added: "2026-11-04",
    players: "2 players",
    color: "#8DBB7A"
  },
  // { title: "Next game", kanji: "新", meaning: "new", desc: "Something new is on the way.", url: "#", added: "2026-12-01", players: "", color: "#74C4C0", soon: true },
];

/* ---------- nothing to edit below this line ---------- */
const NEW_DAYS = 14;
const TILTS = [-7, 4, -3, 8, -5, 2, -9, 6];
const fmt = d => new Date(d + "T12:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const isNew = g => !g.soon && (Date.now() - new Date(g.added + "T12:00:00")) / 864e5 <= NEW_DAYS;

const live = GAMES.filter(g => !g.soon);
const byNewest = [...live].sort((a, b) => b.added.localeCompare(a.added));
const byOldest = [...byNewest].reverse();               // stamps fill the card in the order they were earned
const newest = byNewest[0];

document.getElementById("card-note").textContent =
  `${live.length} stamp${live.length === 1 ? "" : "s"} so far. Every new game earns one. Tap a stamp to play.`;

const cols = 4;
const slots = Math.max(cols * 2, Math.ceil((live.length + 1) / cols) * cols);
const stampHTML = byOldest.map((g, i) => `
  <a class="stamp${g === newest ? " fresh" : ""}" href="${esc(g.url)}" style="--ink:${esc(g.color)};--tilt:${TILTS[i % TILTS.length]}deg"
     aria-label="Play ${esc(g.title)}" title="${esc(g.kanji)}: ${esc(g.meaning)}">
    <span class="seal" lang="ja" aria-hidden="true">${esc(g.kanji)}</span>
    <span class="stamp-name">${esc(g.title)}</span>
  </a>`);
const soon = GAMES.filter(g => g.soon);
for (let i = live.length; i < slots; i++) {
  const s = soon[i - live.length];
  stampHTML.push(`
  <div class="stamp empty" aria-label="${s ? esc(s.title) + ", coming soon" : "Empty slot for the next game"}">
    <span class="seal" lang="ja" aria-hidden="true">次</span>
    <span class="stamp-name">${s ? esc(s.title) : "Next game"}</span>
  </div>`);
}
document.getElementById("stamps").innerHTML = stampHTML.join("");

document.getElementById("games").innerHTML = byNewest.map(g => `
  <li class="game" style="--ink:${esc(g.color)}">
    <a href="${esc(g.url)}">
      <span class="mini" lang="ja" aria-hidden="true">${esc(g.kanji)}</span>
      <h3>${esc(g.title)}${isNew(g) ? '<span class="shin" lang="ja" title="New">新</span>' : ""}</h3>
      <div class="side">
        <div>${esc(g.players)}</div>
        <div><time datetime="${esc(g.added)}">Added ${fmt(g.added)}</time></div>
        <span class="play">Play</span>
      </div>
      <p>${esc(g.desc)}</p>
    </a>
  </li>`).join("");
</script>
</body>
</html>
