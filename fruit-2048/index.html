<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#faf8ef">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fruit 2048">
<title>Fruit 2048</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root { --bg: #faf8ef; --ink: #776e65; --board: #bbada0; --cell: #cdc1b4; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body {
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    background: var(--bg); color: var(--ink); overflow: hidden; height: 100dvh;
    -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
    display: flex; flex-direction: column; align-items: center;
  }
  #wrap { width: 100%; max-width: 520px; flex: 1; display: flex; flex-direction: column; padding: 10px 14px; gap: 10px; min-height: 0; touch-action: none; }
  header { display: flex; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 30px; font-weight: 900; color: #776e65; line-height: 1; flex: 1; }
  h1 span { font-size: 26px; }
  .box { background: var(--board); color: #fff; border-radius: 8px; padding: 4px 10px; min-width: 66px; text-align: center; }
  .box small { display: block; font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #eee4da; }
  .box b { font-size: 19px; font-variant-numeric: tabular-nums; }
  .bar { display: flex; gap: 8px; align-items: center; }
  .bar p { margin: 0; flex: 1; font-size: 14px; line-height: 1.3; }
  button { font: inherit; font-weight: 800; border: none; border-radius: 8px; background: #8f7a66; color: #f9f6f2; height: 44px; padding: 0 14px; font-size: 15px; }
  button:active { filter: brightness(.9); }
  button:disabled { opacity: .4; }
  button.sq { width: 44px; padding: 0; font-size: 19px; }
  #boardArea { flex: 1; min-height: 0; display: grid; place-items: center; }
  #board { position: relative; background: var(--board); border-radius: 10px; }
  .cell, .tile { position: absolute; border-radius: 8px; }
  .cell { background: var(--cell); }
  .tile { display: grid; place-items: center; transition: transform 110ms ease-in-out; will-change: transform; }
  .tile .in { width: 100%; height: 100%; border-radius: 8px; display: grid; place-items: center; line-height: 1; box-shadow: inset 0 -4px 0 rgba(0,0,0,.08); }
  .tile.new .in { animation: appear 180ms 100ms ease both; }
  .tile.merged .in { animation: pop 200ms 100ms ease both; }
  .tile.merged { z-index: 2; }
  @keyframes appear { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes pop { 0% { transform: scale(0); } 60% { transform: scale(1.2); } 100% { transform: scale(1); } }
  .tile.gone { z-index: 0; }
  .tile.poof .in { animation: poof 380ms 100ms ease both; }
  @keyframes poof { 0% { transform: scale(1); opacity: 1; } 40% { transform: scale(1.4) rotate(10deg); opacity: 1; } 100% { transform: scale(0) rotate(40deg); opacity: 0; } }
  #ladder { display: flex; justify-content: center; align-items: center; gap: 2px; padding-bottom: 4px; flex-wrap: nowrap; }
  #ladder span { font-size: 22px; opacity: .25; filter: grayscale(1); transition: all .3s; }
  #ladder span.got { opacity: 1; filter: none; }
  #ladder i { font-style: normal; font-size: 10px; opacity: .4; }
  .overlay { position: absolute; inset: 0; display: none; place-items: center; border-radius: 10px; z-index: 5; text-align: center; animation: fade .4s ease; }
  .overlay.show { display: grid; }
  .overlay.lose { background: rgba(238,228,218,.8); }
  .overlay.win { background: rgba(252,238,178,.93); color: #776e65; }
  .overlay h2 { margin: 0 0 6px; font-size: 34px; }
  .overlay .big { font-size: 64px; }
  .overlay .row { display: flex; gap: 8px; justify-content: center; margin-top: 12px; }
  @keyframes fade { from { opacity: 0; } }
</style>
</head>
<body>
  <div id="wrap">
    <header>
      <h1>Fruit <span>2048</span></h1>
      <div class="box"><small>Score</small><b id="score">0</b></div>
      <div class="box"><small>Best</small><b id="best">0</b></div>
    </header>
    <div class="bar">
      <p>Swipe to slide. Two equal fruits merge into the next one — grow a <b>🍉</b>!</p>
      <button class="sq" id="muteBtn" aria-label="Sound">🔊</button>
      <button class="sq" id="undoBtn" aria-label="Undo">↶</button>
      <button id="newBtn">New</button>
    </div>
    <div id="boardArea">
      <div id="board">
        <div class="overlay lose" id="loseOv"><div><h2>Game over!</h2><div id="loseText"></div><div class="row"><button id="tryBtn">Try again</button></div></div></div>
        <div class="overlay win" id="winOv"><div><div class="big">🍉</div><h2>Watermelon!</h2><div>Two watermelons pop for a big bonus.</div><div class="row"><button id="keepBtn">Keep going</button><button id="winNewBtn">New game</button></div></div></div>
      </div>
    </div>
    <div id="ladder"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
