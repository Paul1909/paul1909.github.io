<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fbf6ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="P. Monsters">
<title>Personality Monsters</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    --bg: #fbf6ff; --panel: #ffffff; --panel2: #f1e9ff; --ink: #3b3355; --dim: #8a80a3;
    --p1: #f59ac0; --p2: #8ccff0; --p1t: #d9558c; --p2t: #3a94c4; --gold: #ffd98a; --mint: #b8ecd0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); overflow: hidden; }
  body { -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  button { font: inherit; color: var(--ink); cursor: pointer; -webkit-tap-highlight-color: transparent; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .screen { position: fixed; inset: 0; display: none; flex-direction: column;
    padding: calc(env(safe-area-inset-top) + 14px) calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 14px) calc(env(safe-area-inset-left) + 16px); }
  .screen.active { display: flex; }
  .solid { background: linear-gradient(180deg, #e9e0ff 0%, #fde6f1 55%, #e2f4fb 100%); overflow-y: auto; }
  .wrap { width: 100%; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; flex: 1; }

  /* Sharp, flat pastel buttons */
  .btn { border: 2px solid var(--ink); border-radius: 0; background: var(--panel); box-shadow: 3px 3px 0 var(--ink); font-weight: 800; min-height: 48px; padding: 0 16px; transition: transform .06s, box-shadow .06s; }
  .btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
  .btn.big { width: 100%; min-height: 58px; font-size: 22px; font-weight: 900; letter-spacing: 1px; background: var(--gold); }
  .btn.alt { background: var(--panel2); }
  .ghost { background: transparent; border: 0; color: var(--dim); padding: 10px; font-size: 16px; font-weight: 700; min-height: 44px; }

  /* Title */
  .logo { text-align: center; margin-top: 5vh; }
  .logo .mons { font-size: 52px; letter-spacing: 6px; }
  .logo h1 { margin: 6px 0 0; font-size: clamp(32px, 10vw, 48px); line-height: .95; font-weight: 900; letter-spacing: -1px; color: var(--ink); }
  .logo p { margin: 10px 0 0; color: var(--dim); font-size: 15px; font-weight: 600; }
  .names { display: flex; flex-direction: column; gap: 10px; }
  label.name { display: flex; align-items: stretch; }
  label.name .dot { width: 46px; flex: none; display: grid; place-items: center; font-weight: 900; border: 2px solid var(--ink); border-right: 0; }
  input[type=text] { flex: 1; font: inherit; font-size: 18px; font-weight: 700; padding: 12px 14px; border-radius: 0; border: 2px solid var(--ink); background: var(--panel); color: var(--ink); outline: none; user-select: text; -webkit-user-select: text; min-width: 0; }
  input[type=text]:focus { background: #fffbea; }
  input::placeholder { color: #b9b0cc; }
  .seg { display: flex; gap: 10px; }
  .seg .btn { flex: 1; font-size: 16px; }
  .seg .btn.on { background: var(--mint); }
  .row { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
  .small { font-size: 13px; color: var(--dim); line-height: 1.45; }

  /* Question */
  .qhead { display: flex; align-items: center; gap: 10px; }
  .chip { padding: 5px 12px; font-weight: 800; font-size: 14px; border: 2px solid var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60vw; }
  .qcount { margin-left: auto; color: var(--dim); font-variant-numeric: tabular-nums; font-weight: 700; }
  .bar { height: 10px; background: #ffffffaa; border: 2px solid var(--ink); overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; transition: width .25s; }
  .statement { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; font-size: clamp(24px, 6.5vw, 34px); font-weight: 800; line-height: 1.2; padding: 10px 4px; min-height: 140px; }
  .statement.pop { animation: pop .25s ease-out; }
  @keyframes pop { from { transform: scale(.94); opacity: .2; } to { transform: none; opacity: 1; } }
  .likert { display: flex; flex-direction: column; gap: 10px; }
  .likert .btn { display: flex; align-items: center; gap: 12px; font-size: 17px; min-height: 52px; text-align: left; }
  .likert .face { font-size: 24px; width: 30px; text-align: center; }
  .likert .btn.picked { background: var(--gold); }
  .qfoot { display: flex; justify-content: space-between; align-items: center; }

  /* Handover */
  .center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 18px; }
  .phone { font-size: 84px; animation: wob 1.4s ease-in-out infinite; }
  @keyframes wob { 0%,100% { transform: rotate(-12deg); } 50% { transform: rotate(12deg) translateX(14px); } }
  .center h2 { margin: 0; font-size: clamp(30px, 9vw, 44px); line-height: 1.05; }

  /* Overlays on 3D */
  .overlay { pointer-events: none; }
  .overlay .pe { pointer-events: auto; }
  .hud { display: flex; gap: 10px; align-items: flex-start; }
  .hp { flex: 1; min-width: 0; }
  .hp .nm { font-weight: 900; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hp .pl { font-size: 12px; font-weight: 700; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hp .track { margin-top: 4px; height: 16px; background: #ffffffcc; border: 2px solid var(--ink); position: relative; overflow: hidden; }
  .hp .track i { position: absolute; inset: 0 auto 0 0; width: 100%; transition: width .35s; }
  .hp .track b { position: absolute; inset: 0 auto 0 0; width: 100%; background: var(--ink); opacity: .18; transition: width 1s .35s; }
  .hp .num { font-size: 12px; font-weight: 800; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .hp.right { text-align: right; }
  .hp.right .track i, .hp.right .track b { inset: 0 0 0 auto; }
  .vs { font-weight: 900; font-size: 20px; padding-top: 8px; }
  .ctrls { display: flex; gap: 8px; justify-content: center; margin-top: auto; }
  .ctrls .btn { min-width: 52px; font-size: 16px; }
  .banner { position: fixed; left: 50%; top: 38%; transform: translate(-50%, -50%); font-size: clamp(34px, 11vw, 70px); font-weight: 900; color: #fff; -webkit-text-stroke: 2px var(--ink); text-shadow: 4px 4px 0 var(--ink); white-space: nowrap; pointer-events: none; opacity: 0; }
  .banner.show { animation: bannerIn 1.3s ease-out forwards; }
  @keyframes bannerIn { 0% { opacity: 0; transform: translate(-50%, -50%) scale(2.2) rotate(-8deg); } 18% { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(-3deg); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -60%) scale(1.05) rotate(-3deg); } }
  #floaters { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .floater { position: absolute; font-weight: 900; white-space: nowrap; transform: translate(-50%, -50%); -webkit-text-stroke: 1.5px var(--ink); text-shadow: 3px 3px 0 var(--ink); will-change: transform, opacity; }
  .tag { position: absolute; transform: translate(-50%, -100%); text-align: center; font-weight: 900; font-size: 14px; padding: 3px 9px; border: 2px solid var(--ink); white-space: nowrap; }
  .tag small { display: block; font-weight: 700; font-size: 11px; }

  /* Reveal cards */
  .revealCards { margin-top: auto; display: flex; gap: 10px; max-width: 640px; width: 100%; align-self: center; }
  .mcard { flex: 1; min-width: 0; background: #ffffffe6; padding: 8px 10px; border: 2px solid var(--ink); border-top-width: 6px; }
  .mcard .t { font-weight: 900; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
  .srow { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 800; margin: 3px 0; }
  .srow span:first-child { width: 20px; }
  .srow .sb { flex: 1; height: 8px; background: #3b335515; }
  .srow .sb i { display: block; height: 100%; }
  .srow span:last-child { width: 32px; text-align: right; font-variant-numeric: tabular-nums; }
  .revealCtrls { margin-top: 10px; }

  /* Results */
  .winner { text-align: center; }
  .winner h2 { margin: 4px 0 2px; font-size: clamp(26px, 7.5vw, 36px); line-height: 1.05; }
  .portraits { display: flex; gap: 10px; }
  .portrait { flex: 1; min-width: 0; text-align: center; background: var(--panel); padding: 8px; border: 2px solid var(--ink); border-top-width: 6px; position: relative; }
  .portrait img { width: 100%; max-width: 200px; aspect-ratio: 1; display: block; margin: 0 auto 6px; background: radial-gradient(circle at 50% 40%, #ffffff, #efe6ff); }
  .portrait .t { font-weight: 900; font-size: 14px; line-height: 1.15; }
  .portrait .sub { font-size: 12px; font-weight: 700; color: var(--dim); }
  .portrait.won::after { content: "🏆"; position: absolute; top: -18px; right: -8px; font-size: 30px; }
  .portrait.lost img { filter: grayscale(.7) opacity(.75); }
  .panel { background: #ffffffd9; border: 2px solid var(--ink); padding: 12px; }
  .mirror { display: flex; flex-direction: column; gap: 10px; }
  .mrow .lbl { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; font-weight: 900; margin-bottom: 3px; }
  .mrow .lbl em { font-style: normal; font-weight: 800; font-size: 13px; text-align: center; flex: 1; padding: 0 6px; }
  .mrow .lbl em span { display: block; font-weight: 600; font-size: 12px; color: var(--dim); }
  .mrow .lbl b { font-variant-numeric: tabular-nums; min-width: 34px; }
  .mrow .lbl b:last-child { text-align: right; }
  .mbars { display: flex; gap: 4px; height: 12px; }
  .mbars > div { flex: 1; background: #3b335512; display: flex; }
  .mbars > div:first-child { justify-content: flex-end; }
  .mbars i { display: block; height: 100%; }
  .btns { display: flex; flex-direction: column; gap: 12px; }
  .mcard .compact { display: none; font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums; }
  @media (min-width: 900px) { .wrap.wide { max-width: 760px; } }
  @media (max-height: 520px) {
    .srow { display: none; }
    .mcard .compact { display: block; }
    .mcard .t { margin: 0; }
    .ctrls .btn { min-height: 40px; }
    .hp .track { height: 12px; }
    .banner { top: 45%; }
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="floaters"></div>

<!-- Title -->
<section class="screen solid active" id="s-title">
  <div class="wrap">
    <div class="logo">
      <div class="mons">👾🧠👹</div>
      <h1>PERSONALITY<br>MONSTERS</h1>
      <p>Two players. One phone.</p>
    </div>
    <div class="names">
      <label class="name"><span class="dot" style="background:var(--p1)">1</span><input type="text" id="name1" maxlength="16" placeholder="Player 1" autocomplete="off"></label>
      <label class="name"><span class="dot" style="background:var(--p2)">2</span><input type="text" id="name2" maxlength="16" placeholder="Player 2" autocomplete="off"></label>
    </div>
    <div class="seg" id="lenSeg">
      <button class="btn" data-len="30">30 questions</button>
      <button class="btn" data-len="60">60 questions</button>
    </div>
    <button class="btn big" id="btnStart">START</button>
    <button class="btn alt" id="btnResume" style="display:none">Resume</button>
    <div class="row">
      <button class="ghost" id="btnDemo">🎲 Random</button>
      <button class="ghost" id="btnMute1">🔊</button>
    </div>
    <p class="small" style="text-align:center;margin-top:auto">Just for fun. Nothing leaves this device.</p>
  </div>
</section>

<!-- Question -->
<section class="screen solid" id="s-q">
  <div class="wrap">
    <div class="qhead"><span class="chip" id="qChip">Player</span><span class="qcount" id="qCount">1 / 30</span></div>
    <div class="bar"><i id="qBar"></i></div>
    <div class="statement" id="qText">…</div>
    <div class="likert" id="likert">
      <button class="btn" data-v="5"><span class="face">😁</span>Totally me</button>
      <button class="btn" data-v="4"><span class="face">🙂</span>Mostly</button>
      <button class="btn" data-v="3"><span class="face">😐</span>Meh</button>
      <button class="btn" data-v="2"><span class="face">🙁</span>Not really</button>
      <button class="btn" data-v="1"><span class="face">😵</span>Not me</button>
    </div>
    <div class="qfoot"><button class="ghost" id="qBack">←</button><button class="ghost" id="qQuit">✕</button></div>
  </div>
</section>

<!-- Handover -->
<section class="screen solid" id="s-hand">
  <div class="wrap">
    <div class="center">
      <div class="phone">📱</div>
      <h2 id="handTitle"></h2>
      <p class="small" id="handSub">No peeking.</p>
      <button class="btn big" id="btnHand" style="max-width:320px">GO</button>
    </div>
  </div>
</section>

<!-- Reveal (over 3D) -->
<section class="screen overlay" id="s-reveal">
  <div class="banner" id="revealBanner">HATCHED!</div>
  <div class="revealCards" id="revealCards"></div>
  <div class="ctrls revealCtrls">
    <button class="btn alt pe" id="btnReroll">🎲</button>
    <button class="btn big pe" id="btnFight" style="width:auto;padding:0 40px;min-height:50px">FIGHT</button>
  </div>
</section>

<!-- Fight HUD (over 3D) -->
<section class="screen overlay" id="s-fight">
  <div class="hud">
    <div class="hp" id="hp1"><div class="nm"></div><div class="pl"></div><div class="track"><b></b><i style="background:var(--p1)"></i></div><div class="num"></div></div>
    <div class="vs">VS</div>
    <div class="hp right" id="hp2"><div class="nm"></div><div class="pl"></div><div class="track"><b></b><i style="background:var(--p2)"></i></div><div class="num"></div></div>
  </div>
  <div class="banner" id="fightBanner">FIGHT!</div>
  <div class="ctrls" id="fightCtrls">
    <button class="btn pe" id="btnSpeed">1×</button>
    <button class="btn pe" id="btnPause">❚❚</button>
    <button class="btn pe" id="btnMute2">🔊</button>
    <button class="btn pe" id="btnSkip">⏭</button>
  </div>
</section>

<!-- Results -->
<section class="screen solid" id="s-res">
  <div class="wrap wide" id="resWrap"></div>
</section>

<script type="module" src="app.js"></script>
</body>
</html>
