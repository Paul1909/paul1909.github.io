<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1a4a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rally '95">
<title>Rally Italia '95</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  /* Bundled font file (offline-safe) + system fallbacks; no Google Fonts link, that would fail offline. */
  @font-face { font-family: "Racing Sans One"; src: url("fonts/racing-sans-one.woff2") format("woff2"); font-display: block; }
  :root { --y: #ffd21a; --o: #ff8a00; --r: #e01b24; --b: #0b1a4a; --b2: #1d3fa8; --arcade: "Racing Sans One", Impact, "Arial Black", "Haettenschweiler", system-ui, sans-serif; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff;
    -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: none; overscroll-behavior: none; }
  #gl { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  .safe { position: fixed; inset: 0; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); pointer-events: none; }
  .safe > * { pointer-events: auto; }
  [hidden] { display: none !important; }
  .arc { font-family: var(--arcade); font-style: italic; letter-spacing: .02em; text-transform: uppercase;
    text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000; }
  .yel { color: var(--y); }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }

  /* ---------- menus ---------- */
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2vh; }
  .logo { text-align: center; line-height: .85; transform: skewX(-8deg); }
  .logo .l1 { font-size: min(15vw, 22vh); background: linear-gradient(#fff36b, #ffb000 55%, #e04a00); -webkit-background-clip: text; background-clip: text; color: transparent;
    -webkit-text-stroke: 2px #200; filter: drop-shadow(4px 4px 0 #000); font-family: var(--arcade); font-style: italic; text-shadow: none; }
  .logo .l2 { font-size: min(6vw, 8vh); color: #fff; }
  .flag { display: inline-block; width: 1.4em; height: .9em; background: linear-gradient(90deg, #0a8f3c 33%, #fff 33% 66%, #d61f26 66%); vertical-align: middle; border: 2px solid #000; margin: 0 .2em; }
  .blink { animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .btn { font-family: var(--arcade); font-style: italic; text-transform: uppercase; font-size: clamp(16px, 4.2vh, 26px); padding: .45em 1.2em; min-height: 44px;
    background: linear-gradient(#3b6cf0, #1d3fa8 60%, #0f2470); border: 3px solid #fff; box-shadow: 4px 4px 0 #000; border-radius: 4px; text-shadow: 2px 2px 0 #000; }
  .btn.go { background: linear-gradient(#ffe36b, #ffb000 55%, #d85a00); color: #fff; }
  .btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #000; }
  .panel { background: linear-gradient(rgba(11, 26, 74, .88), rgba(5, 12, 40, .92)); border: 3px solid #fff; box-shadow: 6px 6px 0 rgba(0, 0, 0, .7); border-radius: 6px; padding: 2vh 2.4vw; }
  .row { display: flex; gap: 1.2vw; align-items: center; justify-content: center; flex-wrap: wrap; }
  .lbl { font-family: var(--arcade); font-style: italic; color: var(--y); text-transform: uppercase; font-size: clamp(13px, 3.4vh, 19px); text-shadow: 2px 2px 0 #000; min-width: 7.5em; text-align: right; }
  .opt { font-family: var(--arcade); font-style: italic; text-transform: uppercase; font-size: clamp(13px, 3.4vh, 19px); padding: .35em .8em; min-height: 40px; border: 2px solid #8aa0d8; background: #10215e; border-radius: 4px; color: #b8c6ee; }
  .opt.on { background: linear-gradient(#ffe36b, #ffb000); color: #3a1300; border-color: #fff; text-shadow: none; }
  .hint { font-size: clamp(11px, 2.6vh, 14px); color: #c9d4f5; text-align: center; }

  #carSel { justify-content: flex-end; padding-bottom: 3vh; box-sizing: border-box; }
  .carbar { display: flex; align-items: center; gap: 2vw; }
  .arrow { font-family: var(--arcade); font-size: clamp(28px, 9vh, 52px); width: 1.6em; height: 1.6em; background: rgba(0, 0, 0, .45); border: 3px solid #fff; border-radius: 50%; box-shadow: 3px 3px 0 #000; }
  #carInfo { min-width: min(64vw, 560px); }
  #carName { font-size: clamp(18px, 5.2vh, 30px); }
  #carVer { font-size: clamp(11px, 2.6vh, 14px); color: #c9d4f5; margin-bottom: .6vh; }
  .stats { display: grid; grid-template-columns: auto 1fr auto; gap: .5vh .8vw; align-items: center; font-size: clamp(11px, 2.8vh, 15px); }
  .stats b { font-family: var(--arcade); font-style: italic; font-weight: normal; color: var(--y); text-transform: uppercase; }
  .bar { height: 1.6vh; min-height: 8px; background: #050c28; border: 2px solid #8aa0d8; }
  .bar i { display: block; height: 100%; background: repeating-linear-gradient(90deg, #ffd21a 0 6px, #ff8a00 6px 8px); }
  .tracks { display: flex; gap: 1vw; }
  .tcard { width: min(21vw, 190px); padding: .5vh .5vw; text-align: center; }
  .tcard canvas { width: 100%; aspect-ratio: 16/10; background: #0a1440; display: block; image-rendering: pixelated; }
  .tcard .tn { font-size: clamp(11px, 2.8vh, 15px); margin-top: .3vh; }
  .tcard .ts { font-size: clamp(9px, 2.2vh, 12px); color: #c9d4f5; font-family: system-ui; font-style: normal; text-transform: none; }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; }
  #hud .safe { pointer-events: none; }
  .hl { position: absolute; left: max(10px, env(safe-area-inset-left)); top: max(8px, env(safe-area-inset-top)); line-height: 1; }
  .hc { position: absolute; left: 50%; top: max(6px, env(safe-area-inset-top)); transform: translateX(-50%); text-align: center; line-height: 1; }
  .hr { position: absolute; right: max(10px, env(safe-area-inset-right)); top: max(8px, env(safe-area-inset-top)); text-align: right; }
  #pos { font-size: clamp(30px, 11vh, 64px); color: var(--y); }
  #pos small { font-size: .45em; color: #fff; }
  #lap, #split { font-size: clamp(14px, 4vh, 22px); }
  #timer { font-size: clamp(26px, 9vh, 52px); color: #fff; }
  #timer.warn { color: #ff4a3a; animation: blink .5s steps(2) infinite; }
  #timerLbl { font-size: clamp(11px, 2.8vh, 15px); color: var(--y); }
  #mini { width: clamp(80px, 26vh, 150px); height: clamp(80px, 26vh, 150px); background: rgba(0, 0, 0, .35); border: 2px solid rgba(255, 255, 255, .6); image-rendering: pixelated; }
  #msg { position: absolute; left: 0; right: 0; top: 30%; text-align: center; font-size: clamp(36px, 15vh, 96px); color: var(--y); pointer-events: none; }
  #msg small { display: block; font-size: .4em; color: #fff; }
  #speedo { position: absolute; left: 50%; bottom: max(4px, env(safe-area-inset-bottom)); transform: translateX(-50%); text-align: center; line-height: .9; }
  #tacho { display: block; width: clamp(150px, 46vh, 240px); height: auto; }
  #spd { font-size: clamp(22px, 7.5vh, 44px); margin-top: -.15em; }
  #spd small { font-size: .38em; color: var(--y); }
  .tbtn { position: absolute; top: max(8px, env(safe-area-inset-top)); pointer-events: auto; font-family: var(--arcade); font-size: 18px; width: 44px; height: 44px;
    background: rgba(0, 0, 0, .45); border: 2px solid #fff; border-radius: 6px; text-shadow: 1px 1px 0 #000; }
  #pauseBtn { left: 50%; transform: translateX(calc(-50% - 170px)); }
  #camBtn { left: 50%; transform: translateX(calc(-50% + 170px)); font-size: 13px; }
  .ctl { position: absolute; bottom: max(10px, env(safe-area-inset-bottom)); pointer-events: auto; display: flex; gap: 12px; touch-action: none; }
  #steerZone { left: max(10px, env(safe-area-inset-left)); }
  #pedals { right: max(10px, env(safe-area-inset-right)); align-items: flex-end; }
  .pad { width: clamp(64px, 24vh, 120px); height: clamp(64px, 24vh, 120px); border-radius: 50%; border: 3px solid rgba(255, 255, 255, .8); background: rgba(0, 0, 0, .35);
    display: flex; align-items: center; justify-content: center; font-family: var(--arcade); font-size: clamp(26px, 9vh, 50px); color: rgba(255, 255, 255, .9); text-shadow: 2px 2px 0 #000; }
  .pad.small { font-size: clamp(12px, 3.4vh, 18px); font-style: italic; }
  .pad.down { background: rgba(255, 210, 26, .55); }
  #brake.down { background: rgba(224, 27, 36, .65); }
  #gas.down { background: rgba(30, 190, 70, .6); }

  #rotate { position: fixed; inset: 0; background: #0b1a4a; display: none; align-items: center; justify-content: center; text-align: center; font-size: 22px; z-index: 50; padding: 20px; }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
  .phone { width: 40px; height: 70px; border: 4px solid #fff; border-radius: 8px; margin: 0 auto 18px; animation: rot 2s ease-in-out infinite; }
  @keyframes rot { 50% { transform: rotate(-90deg); } }
  table.res { border-collapse: collapse; margin: 1vh auto; font-size: clamp(12px, 3.2vh, 17px); }
  table.res td { padding: .2vh 1.2vw; }
  table.res tr.me td { color: var(--y); }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; font-size: 28px; z-index: 40; }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="hud" hidden>
  <div class="hl arc"><div id="pos">4<small>/4</small></div><div id="lap">LAP 1/2</div></div>
  <div class="hc arc"><div id="timerLbl">TIME</div><div id="timer">0:00.00</div><div id="split" class="yel"></div></div>
  <div class="hr"><canvas id="mini" width="150" height="150"></canvas></div>
  <div id="msg" class="arc"></div>
  <div id="speedo" class="arc"><canvas id="tacho" width="256" height="132"></canvas><div id="spd">0<small> km/h</small></div></div>
  <button id="pauseBtn" class="tbtn" aria-label="Pause">II</button>
  <button id="camBtn" class="tbtn" aria-label="Camera">CAM</button>
  <div id="steerZone" class="ctl"><div class="pad" id="left">◀</div><div class="pad" id="right">▶</div></div>
  <div id="pedals" class="ctl"><div class="pad small" id="brake">BRAKE</div><div class="pad small" id="gas">GAS</div></div>
</div>

<div class="safe">
  <div id="title" class="screen">
    <div class="logo arc"><div class="l1">RALLY ITALIA</div><div class="l2"><span class="flag"></span> '95 <span class="flag"></span></div></div>
    <div class="arc yel blink" style="font-size:clamp(18px,5vh,30px)">Tap to start</div>
    <div class="row"><button class="btn" id="optBtn">Options</button></div>
  </div>

  <div id="options" class="screen" hidden>
    <div class="panel">
      <div class="arc" style="font-size:clamp(20px,6vh,34px);text-align:center;margin-bottom:1vh">Options</div>
      <div class="row"><span class="lbl">Music</span><button class="opt" data-set="music" data-v="1">On</button><button class="opt" data-set="music" data-v="0">Off</button></div>
      <div class="row"><span class="lbl">Sound FX</span><button class="opt" data-set="sfx" data-v="1">On</button><button class="opt" data-set="sfx" data-v="0">Off</button></div>
      <div class="row"><span class="lbl">Vibration</span><button class="opt" data-set="vibe" data-v="1">On</button><button class="opt" data-set="vibe" data-v="0">Off</button></div>
      <div class="row"><span class="lbl">Graphics</span><button class="opt" data-set="res" data-v="240">Retro 240p</button><button class="opt" data-set="res" data-v="480">Sharp 480p</button></div>
      <div class="row"><span class="lbl">Auto-accel</span><button class="opt" data-set="auto" data-v="1">On</button><button class="opt" data-set="auto" data-v="0">Off</button></div>
      <div class="row" style="margin-top:1.4vh"><button class="btn" id="optBack">Back</button></div>
    </div>
  </div>

  <div id="carSel" class="screen" hidden>
    <div class="arc" style="position:absolute;top:max(10px,env(safe-area-inset-top));left:0;right:0;text-align:center;font-size:clamp(20px,6vh,34px)">Select your car</div>
    <div class="carbar">
      <button class="arrow arc" id="carPrev" aria-label="Previous car">◀</button>
      <div id="carInfo" class="panel">
        <div id="carName" class="arc yel"></div><div id="carVer"></div>
        <div class="stats" id="stats"></div>
      </div>
      <button class="arrow arc" id="carNext" aria-label="Next car">▶</button>
    </div>
    <div class="row"><button class="btn" id="carBack">Back</button><button class="btn go" id="carOk">Choose</button></div>
  </div>

  <div id="event" class="screen" hidden>
    <div class="panel" style="display:flex;flex-direction:column;gap:1.2vh">
      <div class="row"><span class="lbl">Mode</span><button class="opt" data-ev="mode" data-v="race">Race</button><button class="opt" data-ev="mode" data-v="trial">Time trial</button></div>
      <div class="tracks" id="tracks"></div>
      <div class="row"><span class="lbl">Difficulty</span><button class="opt" data-ev="diff" data-v="0">Easy</button><button class="opt" data-ev="diff" data-v="1">Normal</button><button class="opt" data-ev="diff" data-v="2">Hard</button></div>
      <div class="row"><span class="lbl">Auto-accel</span><button class="opt" data-set="auto" data-v="1">On</button><button class="opt" data-set="auto" data-v="0">Off</button><span class="hint" id="autoHint"></span></div>
      <div class="hint" id="evHint"></div>
      <div class="row"><button class="btn" id="evBack">Back</button><button class="btn go" id="evGo">Start!</button></div>
    </div>
  </div>

  <div id="pause" class="screen" hidden>
    <div class="panel" style="text-align:center">
      <div class="arc" style="font-size:clamp(24px,8vh,44px);margin-bottom:1vh">Pause</div>
      <div class="row" style="margin-bottom:1vh"><span class="lbl">Music</span><button class="opt" data-set="music" data-v="1">On</button><button class="opt" data-set="music" data-v="0">Off</button>
        <span class="lbl">Auto-accel</span><button class="opt" data-set="auto" data-v="1">On</button><button class="opt" data-set="auto" data-v="0">Off</button></div>
      <div class="row"><button class="btn go" id="resume">Resume</button><button class="btn" id="restart">Restart</button><button class="btn" id="quit">Quit</button></div>
    </div>
  </div>

  <div id="results" class="screen" hidden>
    <div class="panel" style="text-align:center;min-width:50vw">
      <div id="resHead" class="arc yel" style="font-size:clamp(30px,11vh,64px)"></div>
      <div id="resSub" class="arc" style="font-size:clamp(14px,4vh,22px)"></div>
      <table class="res" id="resTable"></table>
      <div class="row"><button class="btn go" id="again">Race again</button><button class="btn" id="toMenu">Menu</button></div>
    </div>
  </div>
</div>

<div id="rotate"><div><div class="phone"></div>Turn your phone sideways<br><span style="font-size:15px;color:#c9d4f5">Rally Italia '95 plays in landscape</span></div></div>
<div id="loading" class="arc">Loading…</div>

<script type="module" src="app.js"></script>
</body>
</html>
