<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wire Atlas">
<title>Wire Atlas</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root { --y: #ffd400; --y2: #e8be00; --ink: #1d1d1f; --mut: #8a8a8e; --bd: #e5e5e8; --ok: #22a447; --bad: #e0464c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #fff; color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    display: flex; overflow: hidden; }
  button { font: inherit; color: inherit; cursor: pointer; -webkit-user-select: none; user-select: none; }
  #app { flex: 1; display: flex; flex-direction: column; min-height: 0; width: 100%; max-width: 1300px; margin: 0 auto; }
  #stage { position: relative; flex: 1 1 auto; min-height: 160px; }
  #globe { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
  .ctl { position: absolute; display: flex; flex-direction: column; gap: 8px; }
  #zoomctl { right: 12px; bottom: 12px; }
  #topctl { right: 12px; top: 12px; }
  .round { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--bd); background: rgba(255,255,255,.9);
    display: grid; place-items: center; font-size: 22px; line-height: 1; color: #666; padding: 0; }
  .round svg { width: 20px; height: 20px; stroke: #777; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  /* the pane is as tall as its content, the globe takes the rest */
  /* flex-shrink + min-height 0: on short screens the pane scrolls instead of pushing the buttons off-screen */
  #pane { flex: 0 1 auto; min-height: 0; max-height: 64dvh; overflow-y: auto; padding: 12px 16px 4px;
    border-top: 1px solid var(--bd); -webkit-overflow-scrolling: touch; }
  footer { flex: 0 0 auto; display: flex; gap: 10px; padding: 8px 16px 12px; }
  .btn { flex: 1; min-height: 52px; border-radius: 14px; font-size: 17px; font-weight: 600; border: 1px solid var(--bd);
    background: #fff; }
  .btn.primary { background: var(--y); border-color: var(--y2); }
  .btn:disabled { opacity: .4; cursor: default; }
  .hint { color: var(--mut); font-size: 15px; line-height: 1.45; margin: 6px 0; }
  .hint b { color: var(--ink); font-weight: 600; }
  /* country card: name, capital, flag, shape, location */
  .verdict { font-weight: 700; font-size: 17px; margin: 0 0 6px; }
  .verdict.ok { color: var(--ok); } .verdict.bad { color: var(--bad); }
  .verdict small { font-weight: 500; color: var(--mut); font-size: 14px; }
  .name { font-size: 23px; font-weight: 700; line-height: 1.2; }
  .cap { font-size: 16px; margin: 3px 0 10px; }
  .cap span, .lbl { color: var(--mut); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; margin-right: 6px; }
  .thumbs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .thumbs figure { margin: 0; text-align: center; }
  .thumbs .box { height: 84px; display: grid; place-items: center; }
  .thumbs img { max-width: 100%; max-height: 84px; border: 1px solid var(--bd); border-radius: 3px; display: block; }
  .thumbs canvas { width: 100%; height: 84px; display: block; }
  .thumbs figcaption { color: var(--mut); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; margin-top: 4px; }
  .meta { color: var(--mut); font-size: 13px; margin-top: 8px; }
  /* quiz */
  .prog { display: flex; justify-content: space-between; color: var(--mut); font-size: 13px; margin-bottom: 6px; }
  .bar { height: 4px; background: #f0f0f2; border-radius: 2px; overflow: hidden; margin: 2px 0 10px; }
  .bar i { display: block; height: 100%; background: var(--y); }
  .q { font-size: 18px; font-weight: 600; margin: 0 0 10px; line-height: 1.3; }
  .qflag { display: block; height: 92px; max-width: 100%; margin: 0 auto 12px; border: 1px solid var(--bd); border-radius: 4px; }
  .qinline { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .qinline img { height: 40px; border: 1px solid var(--bd); border-radius: 3px; }
  .qinline b { font-size: 20px; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .opt { min-height: 58px; border-radius: 12px; border: 1px solid var(--bd); background: #fff; font-size: 15px;
    font-weight: 600; padding: 6px 8px; line-height: 1.2; }
  .opt.ok { background: #e6f6ea; border-color: var(--ok); color: #136b2d; }
  .opt.bad { background: #fdecec; border-color: var(--bad); color: #a3262b; }
  .qbig { font-size: 26px; font-weight: 700; line-height: 1.2; margin: 2px 0 10px; }
  .qshape { display: block; width: 100%; height: 110px; margin: 0 0 8px; }
  .qshape.sm { height: 84px; }
  .opt.vis { padding: 5px; min-height: 92px; display: grid; place-items: center; }
  .opt.vis img { max-width: 100%; max-height: 76px; border: 1px solid var(--bd); border-radius: 3px; display: block; }
  .opt.vis canvas { width: 100%; height: 80px; display: block; }
  .opt.vis.ok, .opt.vis.bad { border-width: 3px; padding: 3px; }
  .opt:disabled { cursor: default; }
  /* search (start page only) */
  #search { position: absolute; top: 12px; left: 12px; right: 68px; z-index: 2; }
  .sbox { display: flex; align-items: center; height: 44px; border: 1px solid var(--bd); border-radius: 22px;
    background: rgba(255,255,255,.96); padding: 0 6px 0 12px; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
  .sbox svg { width: 18px; height: 18px; flex: none; stroke: #8a8a8e; fill: none; stroke-width: 2; stroke-linecap: round; }
  #q { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 16px;
    color: var(--ink); padding: 0 8px; height: 100%; -webkit-appearance: none; appearance: none; }
  #q::-webkit-search-cancel-button { display: none; }
  #qclear { width: 32px; height: 32px; border: 0; border-radius: 50%; background: #f0f0f2; color: #666; font-size: 20px; line-height: 1; padding: 0; flex: none; }
  #results { list-style: none; margin: 6px 0 0; padding: 4px; background: #fff; border: 1px solid var(--bd);
    border-radius: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.10); overflow-y: auto; max-height: 300px; }
  #results li { display: flex; align-items: center; gap: 10px; padding: 8px 8px; border-radius: 10px; cursor: pointer; }
  #results li:active, #results li.on { background: #fff8d6; }
  #results img { width: 32px; height: 24px; object-fit: cover; border: 1px solid var(--bd); border-radius: 2px; flex: none; }
  #results b { display: block; font-size: 15px; font-weight: 600; }
  #results small { display: block; color: var(--mut); font-size: 13px; }
  #results .none { color: var(--mut); cursor: default; }
  /* compact look during a quiz, so nothing needs scrolling */
  body.quizzing .btn { min-height: 46px; font-size: 16px; }
  body.quizzing footer { padding: 6px 16px 10px; }
  body.quizzing .q { font-size: 17px; margin-bottom: 8px; }
  body.quizzing .opt { min-height: 46px; font-size: 15px; }
  body.quizzing .opt.vis { min-height: 72px; }
  body.quizzing .opt.vis img { max-height: 58px; }
  body.quizzing .opt.vis canvas { height: 62px; }
  body.quizzing .qflag { height: 78px; margin-bottom: 10px; }
  body.quizzing .qshape { height: 90px; }
  body.quizzing .qshape.sm { height: 70px; }
  body.quizzing .qbig { font-size: 23px; margin-bottom: 8px; }
  body.quizzing .qinline { margin-bottom: 8px; }
  body.quizzing .qinline img { height: 34px; }
  body.quizzing .name { font-size: 21px; }
  body.quizzing .cap { margin-bottom: 8px; }
  body.quizzing .thumbs .box, body.quizzing .thumbs canvas { height: 70px; }
  body.quizzing .thumbs img { max-height: 70px; }
  body.quizzing .verdict { margin-bottom: 4px; }
  /* menu */
  .sec { margin: 4px 0 12px; }
  .sec h3 { margin: 0 0 6px; font-size: 12px; color: var(--mut); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
  .choices { display: flex; flex-wrap: wrap; gap: 6px; }
  .choice { border: 1px solid var(--bd); background: #fff; border-radius: 999px; padding: 9px 14px; font-size: 15px; min-height: 40px; }
  .choices.dim { opacity: .45; }
  .choice:disabled { opacity: .3; cursor: default; }
  .choice.on { background: var(--y); border-color: var(--y2); font-weight: 600; }
  .types { display: grid; gap: 6px; }
  .type { text-align: left; border: 1px solid var(--bd); background: #fff; border-radius: 12px; padding: 10px 12px; }
  .type b { display: block; font-size: 16px; }
  .type span { color: var(--mut); font-size: 13px; }
  .type.on { border-color: var(--y2); background: #fff8d6; }
  /* results */
  .big { font-size: 34px; font-weight: 800; margin: 4px 0 0; }
  .missed { list-style: none; padding: 0; margin: 8px 0; }
  .missed li { display: flex; align-items: center; gap: 10px; padding: 8px 6px; border-bottom: 1px solid var(--bd); cursor: pointer; border-radius: 8px; }
  .missed li.on { background: #fff8d6; }
  .missed img { height: 24px; border: 1px solid var(--bd); border-radius: 2px; }
  .missed small { color: var(--mut); display: block; }
  @media (min-width: 760px) and (min-aspect-ratio: 1/1) {
    #app { display: grid; grid-template-columns: 1fr 400px; grid-template-rows: 1fr auto; }
    #stage { grid-row: 1 / 3; }
    #pane { height: auto; max-height: none; border-top: 0; border-left: 1px solid var(--bd); padding-top: 20px; }
    footer { grid-column: 2; border-left: 1px solid var(--bd); }
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="globe" aria-label="Wireframe globe"></canvas>
    <div id="search" hidden>
      <div class="sbox">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        <input id="q" type="search" placeholder="Search a country or capital" autocomplete="off" autocorrect="off"
          autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="Search a country or capital">
        <button id="qclear" aria-label="Clear" hidden>&times;</button>
      </div>
      <ul id="results" hidden></ul>
    </div>
    <div class="ctl" id="topctl">
      <button class="round" id="mute" aria-label="Sound on/off"></button>
    </div>
    <div class="ctl" id="zoomctl">
      <button class="round" id="zin" aria-label="Zoom in">+</button>
      <button class="round" id="zout" aria-label="Zoom out">&minus;</button>
    </div>
  </div>
  <section id="pane"></section>
  <footer id="foot"></footer>
</div>
<script src="lib/d3-array.min.js"></script>
<script src="lib/d3-geo.min.js"></script>
<script src="lib/topojson-client.min.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
