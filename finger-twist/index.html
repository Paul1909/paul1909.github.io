<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="script-src 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FingerTwist">
<title>Finger Twist</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root { --bg: #0b1020; --panel: #151c38; --line: #232c55; --text: #e8ecff; --muted: #8a93b8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; overscroll-behavior: none; }
  body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #app { height: 100%; display: flex; flex-direction: column; }
  .screen { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .hidden { display: none !important; }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; }

  /* ---------- Menu ---------- */
  #menu { padding: 22px 20px 16px; gap: 14px; overflow-y: auto; max-width: 520px; width: 100%; margin: 0 auto; }
  h1 { margin: 6px 0 0; font-size: 34px; letter-spacing: .5px; text-align: center; font-weight: 800; }
  h1 .r { color: #ff3b5c; } h1 .b { color: #2f8bff; } h1 .y { color: #ffd23f; } h1 .g { color: #2ee59d; }
  .sub { margin: -6px 0 4px; text-align: center; color: var(--muted); font-size: 15px; }
  .label { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: -6px; }
  .chips { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .chip { min-height: 64px; border-radius: 16px; font-size: 18px; font-weight: 700; background: var(--panel);
    color: var(--muted); border: 2px dashed var(--line); transition: transform .1s; }
  .chip.on { background: var(--c); color: #0b1020; border: 2px solid var(--c); box-shadow: 0 0 22px color-mix(in srgb, var(--c) 55%, transparent); }
  .chip:active { transform: scale(.97); }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .seg button, .toggles button { min-height: 46px; border-radius: 12px; background: var(--panel); font-size: 15px; font-weight: 600; color: var(--muted); }
  .seg button.on { background: var(--text); color: var(--bg); }
  .toggles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .toggles button { font-size: 13px; padding: 4px; }
  .toggles button.on { color: var(--text); box-shadow: inset 0 0 0 2px #3c4a8a; }
  .primary { min-height: 58px; border-radius: 16px; background: var(--text); color: var(--bg); font-size: 20px; font-weight: 800; margin-top: 4px; }
  .primary:disabled { opacity: .35; }
  .ghost { min-height: 50px; border-radius: 14px; background: var(--panel); font-size: 17px; font-weight: 600; }
  .rules { color: var(--muted); font-size: 14px; line-height: 1.5; margin: 0; }
  .rules b { color: var(--text); }
  .note { color: #ffd23f; font-size: 13px; margin: 0; }

  /* ---------- Game ---------- */
  #game { padding: 8px 10px 10px; touch-action: none; }
  .hud { flex: none; }
  .hud .row { display: flex; align-items: center; gap: 8px; min-height: 42px; }
  #status { flex: 1; font-size: 21px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #turnNo { color: var(--muted); font-size: 13px; }
  #quit { width: 42px; height: 42px; border-radius: 12px; background: var(--panel); font-size: 18px; color: var(--muted); }
  .bar { height: 6px; background: var(--panel); border-radius: 3px; overflow: hidden; margin: 4px 0 8px; }
  #barFill { height: 100%; width: 100%; transform-origin: left; background: var(--c, #fff); }
  .pills { display: flex; gap: 6px; }
  .pill { flex: 1; text-align: center; border-radius: 10px; padding: 5px 2px; font-size: 14px; font-weight: 800;
    background: var(--c); color: #0b1020; transition: opacity .2s; }
  .pill.cur { box-shadow: 0 0 0 3px var(--text), 0 0 14px var(--c); }
  .pill.out { opacity: .25; text-decoration: line-through; }
  #board { flex: 1; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; margin-top: 10px; }
  #grid { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(6, 1fr); touch-action: none; }
  .tile { position: relative; }
  .tile::before { content: ''; position: absolute; inset: 7%; border-radius: 50%; background: #161d3a; box-shadow: inset 0 0 0 2px var(--line); }
  .tile.held::before { background: var(--c); box-shadow: 0 0 16px color-mix(in srgb, var(--c) 70%, transparent); }
  .tile.held::after { content: ''; position: absolute; inset: 33%; border-radius: 50%; background: rgba(255,255,255,.35); }
  .tile.target::before { background: color-mix(in srgb, var(--c) 25%, #0b1020);
    box-shadow: 0 0 0 5px var(--c), 0 0 30px var(--c); animation: pulse .7s ease-in-out infinite alternate; }
  .tile.lift::before { box-shadow: 0 0 0 5px #fff, 0 0 26px #fff; animation: blink .5s steps(2) infinite; }
  .tile.lift::after { content: '\2191'; inset: 0; background: none; display: grid; place-items: center; color: #0b1020; font-weight: 900; }
  .tile.stray::before { box-shadow: inset 0 0 0 4px rgba(255,255,255,.45); }
  @keyframes pulse { from { transform: scale(.9); } to { transform: scale(1.04); } }
  @keyframes blink { 50% { box-shadow: 0 0 0 5px transparent; } }
  #toast { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: none; opacity: 0; transition: opacity .2s; text-align: center; }
  #toast.show { opacity: 1; }
  #toast .big { font-size: 46px; font-weight: 900; text-shadow: 0 2px 18px #000, 0 0 4px #000; color: var(--c, #fff); }
  #toast .small { font-size: 18px; font-weight: 700; text-shadow: 0 2px 10px #000; }

  /* ---------- Game over ---------- */
  #over { padding: 30px 20px 20px; gap: 14px; justify-content: center; max-width: 520px; width: 100%; margin: 0 auto; }
  #overTitle { margin: 0; text-align: center; font-size: 38px; font-weight: 900; color: var(--c, #fff); text-shadow: 0 0 24px color-mix(in srgb, var(--c, #fff) 60%, transparent); }
  #overSub { margin: -6px 0 6px; text-align: center; color: var(--muted); font-size: 16px; }
  .rank { display: flex; align-items: center; gap: 12px; background: var(--panel); border-radius: 14px; padding: 12px 14px; font-size: 16px; }
  .rank .n { width: 30px; height: 30px; border-radius: 50%; background: var(--c); color: #0b1020; font-weight: 900; display: grid; place-items: center; flex: none; }
  .rank .why { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div id="app">
  <section id="menu" class="screen">
    <h1><span class="r">Finger</span> <span class="b">T</span><span class="y">wi</span><span class="g">st</span></h1>
    <p class="sub">Tap the colours that are playing (1–4)</p>
    <div id="chips" class="chips"></div>
    <div class="label">Speed</div>
    <div id="speeds" class="seg"></div>
    <div class="label">Options</div>
    <div class="toggles">
      <button id="tSound" type="button">Sound</button>
      <button id="tVoice" type="button">Voice</button>
      <button id="tVib" type="button">Vibrate</button>
      <button id="tFs" type="button">Full&shy;screen</button>
    </div>
    <button id="start" class="primary" type="button">Start</button>
    <p id="touchNote" class="note hidden"></p>
    <p id="rules" class="rules"></p>
  </section>

  <section id="game" class="screen hidden">
    <header class="hud">
      <div class="row"><div id="status"></div><span id="turnNo"></span><button id="quit" type="button" aria-label="Quit">✕</button></div>
      <div class="bar"><div id="barFill"></div></div>
      <div id="pills" class="pills"></div>
    </header>
    <div id="board"><div id="grid"></div><div id="toast"><div class="big"></div><div class="small"></div></div></div>
  </section>

  <section id="over" class="screen hidden">
    <h2 id="overTitle"></h2>
    <p id="overSub"></p>
    <div id="ranking"></div>
    <button id="again" class="primary" type="button">Play again</button>
    <button id="toMenu" class="ghost" type="button">Change players</button>
  </section>
</div>
<script src="app.js"></script>
</body>
</html>
